.fabric-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 30px;padding:14px 16px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);backdrop-filter:blur(10px)}
.fabric-controls label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;opacity:.7;margin-left:8px}
.fabric-controls select{background:rgba(20,0,3,.75);color:#fff;border:1px solid rgba(255,255,255,.2);padding:10px 34px 10px 12px;font:inherit;font-size:12px;min-width:150px}

.fabric-card{cursor:pointer}.fabric-image{aspect-ratio:3/4;overflow:hidden;background:rgba(255,255,255,.08)}.fabric-image img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.8,.2,1)}.fabric-card:hover img{transform:scale(1.05)}
.fabric-info{padding:16px 2px}.fabric-code{font-size:10px;letter-spacing:2px;text-transform:uppercase;opacity:.6;margin-bottom:7px}.fabric-name{font-family:"Playfair Display",serif;font-size:21px;margin-bottom:8px}.fabric-price{font-size:14px;font-weight:600}.fabric-meters{font-size:11px;letter-spacing:.8px;margin-top:7px;opacity:.72}.fabric-stock{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;margin-top:8px}.in-stock{color:#c9f7d2}.out-stock{color:#ffd0d0}.fabric-loading{text-align:center;padding:90px 20px;opacity:.7}
@media(max-width:700px){body{padding-top:68px}.navbar{height:68px;padding:0 20px}.brand{font-size:25px}.nav-links{gap:14px}.nav-links a{font-size:11px}.hero{padding:70px 6% 40px}.fabric-area{padding:10px 6% 70px}.fabric-grid{grid-template-columns:repeat(2,1fr);gap:15px}.fabric-name{font-size:17px}}

<body class="fabrics-page">
<header class="navbar"><a href="index.html" class="brand">Onlyhers</a><nav class="nav-links"><a href="collection.html">Collection</a></nav></header>
<section class="hero"><div class="eyebrow">ONLYHERS FABRICS</div><h1>Fabrics.</h1><p>Explore the fabrics behind our designs — available to shop for your own creations.</p></section>
<main class="fabric-area"><a href="collection.html" class="fabric-back">← COLLECTION</a>
<div class="fabric-controls">
<label for="patternFilter">Pattern</label><select id="patternFilter"><option value="">All patterns</option></select>
<label for="fabricSort">Sort</label><select id="fabricSort"><option value="newest">Newest</option><option value="price-low">Price: Low to High</option><option value="price-high">Price: High to Low</option><option value="name">Name: A to Z</option></select>
</div>
<div id="fabricGrid" class="fabric-grid"><div class="fabric-loading">Loading fabrics...</div></div></main>
<footer style="background:#6f0912;text-align:center;padding:60px 20px">OnlyHers · Fabrics for your ideas.</footer>
<script>
const SUPABASE_URL="https://zeodtbgxadxfvexvywpm.supabase.co";
const SUPABASE_KEY="sb_publishable_ywvo11SASIHo-oeNZasF0Q__LmK-oxr";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let allFabrics=[];

function escapeHTML(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}

async function loadFabrics(){
 const grid=document.getElementById("fabricGrid");
 try{
   const {data,error}=await supabaseClient.from("fabrics").select("*").order("created_at",{ascending:false});
   if(error) throw error;
   allFabrics=data||[];
   buildPatternOptions();
   renderFabrics();
 }catch(error){
   console.error("Fabrics load error:",error);
   grid.innerHTML='<div class="fabric-loading">Couldn\'t load fabrics right now.</div>';
 }
}
function buildPatternOptions(){
 const select=document.getElementById("patternFilter");
 const patterns=[...new Set(allFabrics.map(f=>(f.pattern||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
 select.innerHTML='<option value="">All patterns</option>'+patterns.map(p=>'<option value="'+escapeHTML(p)+'">'+escapeHTML(p)+'</option>').join("");
}
function renderFabrics(){
 const grid=document.getElementById("fabricGrid");
 let items=[...allFabrics];
 const pattern=document.getElementById("patternFilter").value;
 const sort=document.getElementById("fabricSort").value;
 if(pattern) items=items.filter(f=>(f.pattern||"")===pattern);
 if(sort==="price-low") items.sort((a,b)=>(Number(a.price)||0)-(Number(b.price)||0));
 if(sort==="price-high") items.sort((a,b)=>(Number(b.price)||0)-(Number(a.price)||0));
 if(sort==="name") items.sort((a,b)=>(a.name||"").localeCompare(b.name||""));
 if(!items.length){grid.innerHTML='<div class="fabric-loading">No fabrics found for this pattern.</div>';return;}
 grid.innerHTML=items.map((f,index)=>{
   const img=f.image_url||"";
   const price=f.price!=null?"₹"+Number(f.price).toLocaleString("en-IN")+" / metre":"Price on request";
   return '<article class="fabric-card" data-fabric-index="'+index+'"><div class="fabric-image">'+(img?'<img src="'+escapeHTML(img)+'" alt="'+escapeHTML(f.name||"OnlyHers Fabric")+'" loading="lazy">':'')+'</div><div class="fabric-info"><div class="fabric-code">'+escapeHTML(f.fabric_code||"ONLYHERS FABRIC")+'</div><h2 class="fabric-name">'+escapeHTML(f.name||"Untitled Fabric")+'</h2>'+(f.pattern?'<div class="fabric-code">'+escapeHTML(f.pattern)+'</div>':'')+'<div class="fabric-price">'+price+'</div><div class="fabric-meters">'+(Number.isFinite(Number(f.available_meters))?'Available: '+Number(f.available_meters)+' metre'+(Number(f.available_meters)===1?'':'s'):'')+'</div><div class="fabric-stock '+(f.is_available!==false?"in-stock":"out-stock")+'">'+(f.is_available!==false?"In Stock":"Out of Stock")+'</div></div></article>';
 }).join("");
 grid.querySelectorAll("[data-fabric-index]").forEach(card=>{
   card.addEventListener("click",()=>{const item=items[Number(card.dataset.fabricIndex)];window.location.href="fabric.html?id="+encodeURIComponent(item.id);});
 });
}
document.getElementById("patternFilter").addEventListener("change",renderFabrics);
document.getElementById("fabricSort").addEventListener("change",renderFabrics);
loadFabrics();
</script></body></html>
