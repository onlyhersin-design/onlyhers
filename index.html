  <script>

    const SUPABASE_KEY =

    const supabaseClient =
      window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


    async function checkUser() {

      } = await supabaseClient.auth.getSession();


      if (session) {

    }
async function loadHomeProducts() {

  const feed =
    document.getElementById(
      "homeProductsFeed"
    );


  if (!feed) return;


  try {

    const {
      data: products,
      error
    } = await supabaseClient
      .from("products")
      .select("*")
      .order("created_at", {
        ascending: false
      });


    if (error) throw error;


    if (!products || products.length === 0) {

      feed.innerHTML = `

        <div class="no-home-products">
          No products available yet.
        </div>

      `;

      return;

    }


    feed.innerHTML =
      products.map((product) => {


        /*
        ONLY COVER PHOTO ON HOMEPAGE
        */

        const coverImage =

          product.cover_image ||

          product.image_url ||

          product.image ||

          product.images?.[0] ||

          "";


        return `

          <section
            class="home-product-slide"
          >

            <a
              href="product.html?id=${product.id}"
              class="home-product-link"
            >

              <img

                src="${coverImage}"

                alt="${
                  product.name ||
                  "OnlyHers Product"
                }"

                class="home-product-cover"

                loading="lazy"

              >

            </a>

          </section>

        `;

      }).join("");

    enableProductZoom();
    
  } catch (error) {

    console.error(
      "Homepage products error:",
      error
    );


    feed.innerHTML = `

      <div class="no-home-products">

        Unable to load products.

      </div>

    `;

  }

}
   checkUser();

loadHomeProducts();

  <script>

function enableProductZoom() {

  const slides =
    document.querySelectorAll(".home-product-slide");

  if (!slides.length) return;


  const observer =
    new IntersectionObserver(

      (entries) => {

        entries.forEach((entry) => {

          if (entry.isIntersecting) {

            slides.forEach((slide) => {
              slide.classList.remove("active");
            });

            entry.target.classList.add("active");

          }

        });

      },

      {
        threshold: 0.7
      }

    );


  slides.forEach((slide) => {
    observer.observe(slide);
  });

}

</script>
