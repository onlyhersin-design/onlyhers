<body class="home-page">

  <!-- HEADER -->
  <header class="navbar">

      <a href="about.html">About</a>
      <a href="collection.html">Collection</a>
      <a href="login.html" id="loginNav">Login</a>
      <a href="signup.html" class="signup-nav" id="signupNav">Sign Up</a>
    </nav>
  </header>

  <!-- FESTIVE HEADER IS CREATED BY homepage-order.js; no close button -->

  <!-- FULL SCREEN PRODUCT HOME -->
  <main class="home-product-feed">
    <div id="homeProductsFeed" class="home-products-feed">
      <div class="products-loading">Loading collection...</div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <h2>Onlyhers</h2>
    <p>A little fashion, a little lifestyle, a little her.</p>
    <p class="copyright">© 2026 Onlyhers. Made for her.</p>
  </footer>

  <!-- SUPABASE CHECK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://zeodtbgxadxfvexvywpm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_ywvo11SASIHo-oeNZasF0Q__LmK-oxr";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function updateAuthNavigation(session) {
      const loginNav = document.getElementById("loginNav");
      const signupNav = document.getElementById("signupNav");
      if (!loginNav || !signupNav) return;

      if (session) {
        loginNav.textContent = "My Account";
        loginNav.href = "account.html";
        signupNav.style.display = "none";
        signupNav.setAttribute("aria-hidden", "true");
      } else {
        loginNav.textContent = "Login";
        loginNav.href = "login.html";
        signupNav.style.display = "";
        signupNav.removeAttribute("aria-hidden");
      }
    }

    async function checkUser() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      updateAuthNavigation(session);

      supabaseClient.auth.onAuthStateChange((_event, session) => {
        updateAuthNavigation(session);
      });
    }

    async function loadHomeProducts() {
      const feed = document.getElementById("homeProductsFeed");
      if (!feed) return;
      try {
        const { data: products, error } = await supabaseClient
          .from("products")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) throw error;
        if (!products || products.length === 0) {
          feed.innerHTML = `<div class="no-home-products">No products available yet.</div>`;
          return;
        }

        feed.innerHTML = products.map((product) => {
          const coverImage = product.cover_image || product.image_url || product.image || product.images?.[0] || "";
          return `
            <section class="home-product-slide">
              <a href="product.html?id=${product.id}" class="home-product-link">
                <img src="${coverImage}" alt="${product.name || "OnlyHers Product"}" class="home-product-cover" loading="lazy">
              </a>
            </section>
          `;
        }).join("");
        enableProductZoom();
      } catch (error) {
        console.error("Homepage products error:", error);
        feed.innerHTML = `<div class="no-home-products">Unable to load products.</div>`;
      }
    }

    checkUser();
    loadHomeProducts();

    /* Add a slightly deeper glass effect after scrolling */
    const navbar = document.querySelector('.navbar');
    window.addEventListener('scroll', () => {
      navbar?.classList.toggle('scrolled', window.scrollY > 20);
    }, { passive: true });
  </script>

  <script>
    function enableProductZoom() {
      const slides = document.querySelectorAll(".home-product-slide");
      if (!slides.length) return;
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            slides.forEach((slide) => slide.classList.remove("active"));
            entry.target.classList.add("active");
          }
        });
      }, { threshold: 0.7 });
      slides.forEach((slide) => observer.observe(slide));
    }
  </script>

  <!-- Cache-busted latest homepage ordering/festive banner script -->
  <script src="homepage-order.js?v=20260914-no-close"></script>
