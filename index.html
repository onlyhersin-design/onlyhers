<!doctype html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OnlyHers | Made for Her</title>

<meta name="description"
content="OnlyHers is a women's fashion brand founded by Hari Venkatesh in 2026.">

<link rel="icon" href="favicon.png">
<img src="./onlyhers-logo.png" alt="OnlyHers">

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

<style>

:root{
  --red:#a8242e;
  --darkred:#7e141d;
  --cream:#f5efe7;
  --black:#171212;
  --white:#ffffff;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:"DM Sans",sans-serif;
  background:var(--cream);
  color:var(--black);
}

/* NAVIGATION */

nav{
  height:75px;
  background:var(--red);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  position:sticky;
  top:0;
  z-index:1000;
  border-bottom:1px solid rgba(0,0,0,.15);
}

.logo img{
  height:52px;
  max-width:150px;
  object-fit:contain;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:25px;
}

.nav-links a,
.nav-links button{
  text-decoration:none;
  color:#111;
  background:none;
  border:none;
  font-family:"DM Sans";
  font-size:11px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.1em;
  cursor:pointer;
}

.cart-number{
  background:#111;
  color:white;
  border-radius:50%;
  padding:3px 7px;
  font-size:10px;
}

/* HERO */

.hero{
  min-height:85vh;
  background:
  radial-gradient(circle at 20% 20%,rgba(255,255,255,.15),transparent 30%),
  linear-gradient(135deg,var(--red),var(--darkred));

  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:80px 20px;
}

.hero-content{
  max-width:850px;
}

.hero-logo{
  width:min(420px,80vw);
  max-height:180px;
  object-fit:contain;
}

.hero h1{
  font-family:"Playfair Display";
  font-size:clamp(55px,9vw,110px);
  font-weight:400;
  line-height:.95;
  margin:35px 0 20px;
}

.hero p{
  font-size:15px;
  max-width:550px;
  margin:auto;
  line-height:1.8;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:15px 24px;
  background:#111;
  color:white;
  text-decoration:none;
  border:1px solid #111;
  font-size:11px;
  font-weight:600;
  letter-spacing:.1em;
  text-transform:uppercase;
  cursor:pointer;
  transition:.25s;
}

.btn:hover{
  background:transparent;
  color:#111;
}

.btn-outline{
  background:transparent;
  color:#111;
}

/* PRODUCTS */

.section{
  padding:90px 7%;
}

.section-header{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:40px;
}

.section-header h2{
  font-family:"Playfair Display";
  font-size:clamp(45px,6vw,75px);
  font-weight:400;
  margin:0;
}

.section-header p{
  font-size:11px;
  letter-spacing:.15em;
}

.products-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:25px;
}

.product-card{
  background:white;
  position:relative;
  cursor:pointer;
}

.product-card img{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  display:block;
}

.product-info{
  padding:18px;
}

.product-info h3{
  font-family:"Playfair Display";
  font-size:24px;
  font-weight:400;
  margin:0 0 8px;
}

.product-price{
  font-size:14px;
}

.wishlist-btn{
  position:absolute;
  right:12px;
  top:12px;

  width:42px;
  height:42px;

  border:none;
  border-radius:50%;

  background:white;
  font-size:20px;

  cursor:pointer;
}

.loading{
  grid-column:1/-1;
  text-align:center;
  padding:60px;
}

/* PRODUCT MODAL */

.modal{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.55);

  display:none;

  align-items:center;
  justify-content:center;

  z-index:2000;

  padding:20px;
}

.modal.active{
  display:flex;
}

.modal-box{
  background:var(--cream);

  width:min(1000px,100%);

  max-height:90vh;

  overflow:auto;

  position:relative;
}

.close{
  position:absolute;

  right:15px;
  top:15px;

  z-index:2;

  width:40px;
  height:40px;

  border:none;
  border-radius:50%;

  background:white;

  cursor:pointer;

  font-size:20px;
}

.product-modal-content{
  display:grid;

  grid-template-columns:1fr 1fr;
}

.product-modal-content img{
  width:100%;
  height:100%;
  max-height:700px;
  object-fit:cover;
}

.product-details{
  padding:55px 40px;
}

.product-details h2{
  font-family:"Playfair Display";

  font-size:50px;

  font-weight:400;

  margin:10px 0;
}

.product-description{
  line-height:1.8;
  color:#555;
}

.sizes{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:15px 0 25px;
}

.size-btn{
  min-width:45px;
  padding:11px;

  border:1px solid #999;

  background:white;

  cursor:pointer;
}

.size-btn.active{
  background:#111;
  color:white;
}

.quantity{
  display:flex;

  align-items:center;

  gap:15px;

  margin:25px 0;
}

.quantity button{
  width:35px;
  height:35px;

  border:1px solid #aaa;

  background:white;

  cursor:pointer;
}

/* CART */

.cart-panel{
  position:fixed;

  right:-450px;
  top:0;

  width:min(420px,100%);

  height:100vh;

  background:var(--cream);

  z-index:3000;

  padding:25px;

  transition:.35s;

  overflow:auto;
}

.cart-panel.active{
  right:0;
}

.cart-header{
  display:flex;

  justify-content:space-between;

  align-items:center;
}

.cart-item{
  display:grid;

  grid-template-columns:80px 1fr;

  gap:15px;

  background:white;

  padding:12px;

  margin:15px 0;
}

.cart-item img{
  width:80px;
  height:100px;

  object-fit:cover;
}

.remove-btn{
  background:none;
  border:none;

  color:var(--red);

  padding:0;

  cursor:pointer;
}

/* AUTH */

.auth-modal{
  position:fixed;

  inset:0;

  background:rgba(0,0,0,.55);

  display:none;

  align-items:center;
  justify-content:center;

  z-index:4000;

  padding:20px;
}

.auth-modal.active{
  display:flex;
}

.auth-box{
  width:min(430px,100%);

  background:white;

  padding:35px;

  position:relative;
}

.auth-tabs{
  display:flex;

  gap:25px;

  margin-bottom:25px;
}

.auth-tab{
  border:none;

  background:none;

  font-size:14px;

  cursor:pointer;

  padding-bottom:8px;
}

.auth-tab.active{
  border-bottom:2px solid var(--red);
}

.auth-box input{
  width:100%;

  padding:14px;

  margin:8px 0;

  border:1px solid #ccc;

  font-family:"DM Sans";
}

.message{
  padding:10px;

  margin:10px 0;

  background:#f5efe7;

  font-size:13px;
}

/* ACCOUNT */

.account-bar{
  display:none;

  background:white;

  padding:15px 7%;

  justify-content:space-between;

  align-items:center;
}

/* FOOTER */

footer{
  background:var(--darkred);

  padding:35px;

  text-align:center;

  font-size:11px;

  letter-spacing:.12em;
}

/* MOBILE */

@media(max-width:750px){

  .nav-links{
    gap:13px;
  }

  .nav-links a:not(.mobile-keep){
    display:none;
  }

  .products-grid{
    grid-template-columns:repeat(2,1fr);

    gap:12px;
  }

  .product-info{
    padding:12px;
  }

  .product-info h3{
    font-size:19px;
  }

  .product-modal-content{
    grid-template-columns:1fr;
  }

  .product-details{
    padding:30px 20px;
  }

  .product-details h2{
    font-size:40px;
  }

}

</style>

</head>

<body>

<!-- SUPABASE -->

<script type="module">

import {
createClient
}
from
'https://esm.sh/@supabase/supabase-js@2';


/* ============================= */
/* YOUR SUPABASE DETAILS */
/* ============================= */

const SUPABASE_URL =
'https://zeodtbgxadxfvexvywpm.supabase.co';


const SUPABASE_KEY =
'sb_publishable_ywvo11SASIHo-oeNZasF0Q__LmK-oxr';


const supabase =
createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* ============================= */
/* WHATSAPP */
/* ============================= */

const WHATSAPP_NUMBER =
'919059828206';


/* ============================= */
/* VARIABLES */
/* ============================= */

let products = [];

let selectedProduct = null;

let selectedSize = null;

let quantity = 1;

let cart =
JSON.parse(
localStorage.getItem('onlyhers_cart')
|| '[]'
);


let wishlist =
JSON.parse(
localStorage.getItem('onlyhers_wishlist')
|| '[]'
);


let authMode = 'login';


/* ============================= */
/* LOAD PRODUCTS */
/* ============================= */

async function loadProducts(){

const grid =
document.getElementById('productsGrid');


const {
data,
error
}
=
await supabase
.from('products')
.select('*')
.eq('is_available',true)
.order(
'created_at',
{
ascending:false
}
);


if(error){

console.error(error);

grid.innerHTML = `
<div class="loading">
Unable to load products.
Please try again later.
</div>
`;

return;

}


products = data || [];


if(products.length === 0){

grid.innerHTML = `
<div class="loading">

Something beautiful is coming soon for her ❤️

</div>
`;

return;

}


grid.innerHTML =
products.map(product => `

<div class="product-card">

<button
class="wishlist-btn"
onclick="toggleWishlist('${product.id}')">

${wishlist.includes(product.id) ? '♥' : '♡'}

</button>


<div
onclick="openProduct('${product.id}')">

<img
src="${escapeHTML(product.image_url)}"
alt="${escapeHTML(product.name)}">


<div class="product-info">

<h3>

${escapeHTML(product.name)}

</h3>


<div class="product-price">

${formatPrice(product.price)}

</div>

</div>

</div>

</div>

`).join('');

}


loadProducts();



/* ============================= */
/* PRODUCT DETAILS */
/* ============================= */

window.openProduct =
function(id){

selectedProduct =
products.find(
p => String(p.id) === String(id)
);


if(!selectedProduct) return;


let sizes =
selectedProduct.sizes;


if(Array.isArray(sizes)){

sizes = sizes;

}
else if(typeof sizes === 'string'){

sizes =
sizes
.split(',')
.map(s => s.trim())
.filter(Boolean);

}
else{

sizes =
['XS','S','M','L','XL'];

}


selectedSize =
sizes[0] || null;


quantity = 1;


const content =
document.getElementById('productContent');


content.innerHTML = `

<div class="product-modal-content">


<img
src="${escapeHTML(selectedProduct.image_url)}"
alt="${escapeHTML(selectedProduct.name)}">


<div class="product-details">

<p style="
font-size:11px;
letter-spacing:.15em;
">

ONLYHERS

</p>


<h2>

${escapeHTML(selectedProduct.name)}

</h2>


<h3>

${formatPrice(selectedProduct.price)}

</h3>


<p class="product-description">

${escapeHTML(
selectedProduct.description
||
'Designed thoughtfully and made beautifully for her.'
)}

</p>


<p><strong>Select size</strong></p>


<div class="sizes">

${sizes.map((size,index)=>`

<button
class="size-btn ${index===0?'active':''}"
onclick="selectSize('${escapeHTML(size)}',this)">

${escapeHTML(size)}

</button>

`).join('')}

</div>


<div class="quantity">

<button onclick="changeQuantity(-1)">

−

</button>


<span id="quantityNumber">

1

</span>


<button onclick="changeQuantity(1)">

+

</button>

</div>


<button
class="btn"
onclick="addToCart()">

Add to cart

</button>


<button
class="btn btn-outline"
onclick="buyNow()">

Order on WhatsApp

</button>

</div>

</div>

`;


document
.getElementById('productModal')
.classList.add('active');

};



window.closeProduct =
function(){

document
.getElementById('productModal')
.classList.remove('active');

};



window.selectSize =
function(size,element){

selectedSize = size;


document
.querySelectorAll('.size-btn')
.forEach(button =>
button.classList.remove('active')
);


element.classList.add('active');

};



window.changeQuantity =
function(change){

quantity += change;


if(quantity < 1){

quantity = 1;

}


document
.getElementById('quantityNumber')
.textContent = quantity;

};



/* ============================= */
/* CART */
/* ============================= */

window.addToCart =
function(){

if(!selectedProduct) return;


const existing =
cart.find(item =>

String(item.id) ===
String(selectedProduct.id)

&&

item.size === selectedSize

);


if(existing){

existing.quantity += quantity;

}
else{

cart.push({

id:selectedProduct.id,

name:selectedProduct.name,

price:selectedProduct.price,

image_url:selectedProduct.image_url,

size:selectedSize,

quantity:quantity

});

}


saveCart();


alert(
'Added to your cart 🖤'
);

};


function saveCart(){

localStorage.setItem(
'onlyhers_cart',
JSON.stringify(cart)
);


updateCartCount();


renderCart();

}


function updateCartCount(){

const count =
cart.reduce(
(total,item) =>
total + item.quantity,
0
);


document
.getElementById('cartCount')
.textContent = count;

}


window.toggleCart =
function(){

document
.getElementById('cartPanel')
.classList.toggle('active');


renderCart();

};


function renderCart(){

const container =
document.getElementById('cartItems');


const totalElement =
document.getElementById('cartTotal');


if(cart.length === 0){

container.innerHTML = `

<div class="loading">

Your cart is empty.

</div>

`;


totalElement.innerHTML = '';

return;

}


container.innerHTML =
cart.map((item,index)=>`

<div class="cart-item">

<img
src="${escapeHTML(item.image_url)}">


<div>

<strong>

${escapeHTML(item.name)}

</strong>


<p>

Size: ${escapeHTML(item.size)}

</p>


<p>

Quantity: ${item.quantity}

</p>


<strong>

${formatPrice(
Number(item.price)
*
item.quantity
)}

</strong>


<br><br>


<button
class="remove-btn"
onclick="removeCartItem(${index})">

Remove

</button>

</div>

</div>

`).join('');


const total =
cart.reduce(
(sum,item)=>
sum +
(
Number(item.price)
*
item.quantity
),
0
);


totalElement.innerHTML = `

<h3>

Total:
${formatPrice(total)}

</h3>

`;

}


window.removeCartItem =
function(index){

cart.splice(index,1);


saveCart();

};


updateCartCount();



/* ============================= */
/* WHATSAPP CHECKOUT */
/* ============================= */

window.checkoutWhatsApp =
function(){

if(cart.length === 0){

alert(
'Your cart is empty.'
);

return;

}


let message =
'Hi OnlyHers! 👋\n\nI would like to place an order:\n\n';


cart.forEach((item,index)=>{

message +=
`${index + 1}. ${item.name}\n`;

message +=
`Size: ${item.size}\n`;

message +=
`Quantity: ${item.quantity}\n`;

message +=
`Price: ${formatPrice(
Number(item.price)
*
item.quantity
)}\n\n`;

});


const total =
cart.reduce(
(sum,item)=>
sum +
(
Number(item.price)
*
item.quantity
),
0
);


message +=
`Total: ${formatPrice(total)}`;


window.open(

`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`,

'_blank'

);

};


window.buyNow =
function(){

const message =
`Hi OnlyHers! 👋

I would like to order:

${selectedProduct.name}

Size: ${selectedSize}

Quantity: ${quantity}

Price: ${formatPrice(
Number(selectedProduct.price)
*
quantity
)}
`;


window.open(

`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`,

'_blank'

);

};



/* ============================= */
/* WISHLIST */
/* ============================= */

window.toggleWishlist =
function(id){

if(wishlist.includes(id)){

wishlist =
wishlist.filter(
item => item !== id
);

}
else{

wishlist.push(id);

}


localStorage.setItem(
'onlyhers_wishlist',
JSON.stringify(wishlist)
);


loadProducts();

};


window.showWishlist =
function(){

const wishlistProducts =
products.filter(product =>
wishlist.includes(product.id)
);


if(wishlistProducts.length === 0){

alert(
'Your wishlist is empty ♡'
);

return;

}


document
.getElementById('shop')
.scrollIntoView();


const grid =
document.getElementById('productsGrid');


grid.innerHTML =
wishlistProducts.map(product => `

<div
class="product-card"
onclick="openProduct('${product.id}')">

<img
src="${escapeHTML(product.image_url)}">


<div class="product-info">

<h3>

${escapeHTML(product.name)}

</h3>


<div>

${formatPrice(product.price)}

</div>

</div>

</div>

`).join('');

};



/* ============================= */
/* LOGIN / SIGNUP */
/* ============================= */

window.openAccount =
async function(){

const {
data:{
user
}
}
=
await supabase.auth.getUser();


if(user){

showAccount(user);

return;

}


document
.getElementById('authModal')
.classList.add('active');

};


window.closeAuth =
function(){

document
.getElementById('authModal')
.classList.remove('active');

};


window.setAuthMode =
function(mode){

authMode = mode;


document
.getElementById('loginTab')
.classList.toggle(
'active',
mode === 'login'
);


document
.getElementById('signupTab')
.classList.toggle(
'active',
mode === 'signup'
);


document
.getElementById('authSubmit')
.textContent =
mode === 'login'
?
'Login'
:
'Create account';

};


window.submitAuth =
async function(){

const email =
document
.getElementById('authEmail')
.value;


const password =
document
.getElementById('authPassword')
.value;


const message =
document
.getElementById('authMessage');


message.innerHTML = '';


if(!email || !password){

message.innerHTML =
'<div class="message">Please enter your email and password.</div>';

return;

}


let result;


if(authMode === 'signup'){

result =
await supabase.auth.signUp({

email,

password

});

}
else{

result =
await supabase.auth.signInWithPassword({

email,

password

});

}


if(result.error){

message.innerHTML = `

<div class="message">

${escapeHTML(result.error.message)}

</div>

`;

return;

}


message.innerHTML = `

<div class="message">

${authMode === 'signup'
?
'Account created! Please check your email if confirmation is required.'
:
'Login successful! 🖤'}

</div>

`;


setTimeout(
async () => {

closeAuth();

checkUser();

},
800
);

};

async function(){

const email =
document
.getElementById('authEmail')
.value;


if(!email){

alert(
'Please enter your email first.'
);

return;

}


const {
error
}
=
await supabase
.auth
.resetPasswordForEmail(
email,
{
redirectTo:
window.location.origin
}
);

alert(error.message);

}
else{

alert(
'Password reset link sent to your email.'
);

}

};

async function checkUser(){

const {
data:{
user
}
}
=
await supabase.auth.getUser();


const button =
document
.getElementById('accountButton');


const accountBar =
document
.getElementById('accountBar');

'Account';

'flex';

.getElementById('userEmail')

user.email;

}
else{

'Login';


accountBar.style.display =
'none';

}

}


function showAccount(user){

document
.getElementById('accountBar')
.style.display =
'flex';


document
.getElementById('userEmail')
.textContent =
user.email;


window.scrollTo({

top:0,

behavior:'smooth'

});

}


window.logout =
async function(){

await supabase.auth.signOut();


alert(

);

};

/* ============================= */
/* HELPERS */
/* ============================= */

function formatPrice(price){

if(
price === null ||
price === undefined
){

return '';

}


return
'₹' +
Number(price)
.toLocaleString('en-IN');

}


function escapeHTML(value){

return String(value ?? '')

.replace(
/&/g,
'&amp;'
)

.replace(
/</g,
'&lt;'
)

.replace(
/>/g,
'&gt;'
)

.replace(
/"/g,
'&quot;'
)

.replace(
/'/g,
'&#039;'
);

}
