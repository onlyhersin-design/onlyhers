<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Product | OnlyHers</title>

  <link rel="icon" type="image/png" href="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Your existing Supabase connection -->
  <script src="app.js"></script>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(210,60,70,.22), transparent 28%),
        radial-gradient(circle at 90% 85%, rgba(50,0,8,.35), transparent 30%),
        #8f0d1b;

      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* HEADER */

    header {
      width: 100%;
      padding: 20px 7%;
      background: rgba(35, 10, 13, .32);
      -webkit-backdrop-filter: blur(18px) saturate(125%);
      backdrop-filter: blur(18px) saturate(125%);
      border-bottom: 1px solid rgba(255,255,255,.16);
      box-shadow: 0 8px 28px rgba(0,0,0,.10);

      display: flex;
      align-items: center;
      justify-content: space-between;

      position: fixed;
      top: 0;
      z-index: 100;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-family: "Playfair Display", serif;
      font-size: 30px;
      font-weight: 600;
    }

    .logo span {
      font-family: "Great Vibes", cursive;
      font-size: 34px;
      margin-left: 3px;
    }

    nav {
      display: flex;
      gap: 25px;
      align-items: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 14px;
      opacity: .9;
    }

    .collection-btn {
      border: 1px solid rgba(255,255,255,.7);
      padding: 10px 18px;
    }

    /* PAGE */

    .product-page {
      max-width: 1300px;
      margin: auto;
      padding: 135px 30px 100px;
    }

    .back-link {
      display: inline-block;
      color: rgba(255,255,255,.8);
      text-decoration: none;
      margin-bottom: 40px;
      transition: .3s;
    }

    .back-link:hover {
      transform: translateX(-5px);
      color: white;
    }

    .product-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: start;

      animation: fadeUp .7s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       IMAGE GALLERY
    ========================= */

    .gallery {
      width: 100%;
    }

    .main-image-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background: rgba(255,255,255,.08);
    }

    .main-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: zoom-in;
      transition: opacity .3s ease, transform .5s ease;
    }

    .main-image:hover {
      transform: scale(1.02);
    }

    /* Gallery arrows */

    .gallery-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);

      width: 48px;
      height: 48px;

      border: 1px solid rgba(255,255,255,.5);
      background: rgba(80,0,10,.5);

      color: white;
      font-size: 25px;

      cursor: pointer;
      z-index: 5;

      transition: .3s;
    }

    .gallery-arrow:hover {
      background: white;
      color: #8f0d1b;
    }

    .prev-image {
      left: 15px;
    }

    .next-image {
      right: 15px;
    }

    /* Image counter */

    .image-counter {
      position: absolute;
      bottom: 18px;
      right: 18px;

      background: rgba(0,0,0,.5);
      backdrop-filter: blur(10px);

      padding: 7px 12px;
      font-size: 12px;
      z-index: 5;
    }

    /* THUMBNAILS */

    .thumbnails {
      display: flex;
      gap: 12px;
      margin-top: 18px;

      overflow-x: auto;
      padding-bottom: 5px;
    }

    .thumbnail {
      flex: 0 0 82px;
      width: 82px;
      height: 105px;

      border: 1px solid transparent;
      padding: 0;
      background: transparent;

      cursor: pointer;
      overflow: hidden;

      opacity: .65;
      transition: .3s;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumbnail:hover {
      opacity: 1;
    }

    .thumbnail.active {
      opacity: 1;
      border: 2px solid white;
    }

    /* PRODUCT DETAILS */

    .product-category {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #f4c7cb;
      margin-bottom: 18px;
    }

    .product-name {
      font-family: "Playfair Display", serif;
      font-size: clamp(42px, 5vw, 68px);
      line-height: 1.05;
      margin-bottom: 20px;
    }

    .product-price {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 30px;
    }

    .product-line {
      height: 1px;
      background: rgba(255,255,255,.2);
      margin-bottom: 30px;
    }

    .product-description {
      color: rgba(255,255,255,.82);
      line-height: 1.8;
      font-size: 16px;
      margin-bottom: 35px;
    }

    /* SIZES */

    .size-title {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    .sizes {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 35px;
    }

    .size-btn {
      min-width: 55px;
      padding: 13px 16px;

      background: transparent;
      border: 1px solid rgba(255,255,255,.5);

      color: white;
      cursor: pointer;

      transition: .3s;
    }

    .size-btn.active,
    .size-btn:hover {
      background: white;
      color: #8f0d1b;
    }

    /* BUTTON */

    .order-btn {
      width: 100%;
      padding: 19px;

      border: none;
      background: white;
      color: #8f0d1b;

      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;

      cursor: pointer;
      transition: .3s;
    }

    .order-btn:hover {
      background: #1a1113;
      color: white;
      transform: translateY(-2px);
    }

    .product-note {
      text-align: center;
      margin-top: 15px;
      color: rgba(255,255,255,.6);
      font-size: 12px;
    }

    /* LOADING / ERROR */

    .loading,
    .error-message {
      text-align: center;
      padding: 100px 20px;
      grid-column: 1 / -1;
    }

    .error-message h2 {
      font-family: "Playfair Display", serif;
      font-size: 42px;
      margin-bottom: 15px;
    }

    /* IMAGE MODAL */

    .image-modal {
      display: none;

      position: fixed;
      inset: 0;

      background: rgba(0,0,0,.93);

      z-index: 1000;

      align-items: center;
      justify-content: center;

      padding: 30px;
    }

    .image-modal.open {
      display: flex;
    }

    .modal-image {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
    }

    .close-modal {
      position: absolute;
      top: 25px;
      right: 30px;

      background: transparent;
      border: none;

      color: white;
      font-size: 38px;
      cursor: pointer;
    }

    /* FOOTER */

    footer {
      background: #670914;
      padding: 60px 20px 35px;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,.1);
    }

    .footer-brand {
      font-family: "Playfair Display", serif;
      font-size: 32px;
    }

    .hers-by {
      font-family: "Great Vibes", cursive;
      font-size: 32px;
      color: #f3c7c7;
      margin: 10px 0 18px;
    }

    .footer-text {
      font-size: 13px;
      color: rgba(255,255,255,.6);
    }

    /* MOBILE */

    @media (max-width: 850px) {

      header {
        padding: 18px 6%;
      }

      nav a:first-child {
        display: none;
      }

      .product-page {
        padding: 40px 20px 70px;
      }

      .product-container {
        grid-template-columns: 1fr;
        gap: 45px;
      }

      .product-name {
        font-size: 48px;
      }

      .thumbnail {
        flex-basis: 68px;
        width: 68px;
        height: 88px;
      }

    }

  </style>
</head>


<body>

  <header>

    <a href="index.html" class="logo">
      Only<span>Hers</span>
    </a>

    <nav>
      <a href="index.html">Home</a>
      <a href="collection.html" class="collection-btn">
        Collection
      </a>
    </nav>

  </header>


  <main class="product-page">

    <a href="collection.html" class="back-link">
      ← Back to collection
    </a>

    <div id="productContent">

      <div class="loading">
        Loading your piece...
      </div>

    </div>

  </main>


  <footer>

    <div class="footer-brand">
      OnlyHers
    </div>

    <div class="hers-by">
      Hers by Hari Venkatesh
    </div>

    <p class="footer-text">
      © 2026 OnlyHers. Thoughtfully designed fashion made to feel like yours.
    </p>

  </footer>


  <!-- IMAGE MODAL -->

  <div class="image-modal" id="imageModal">

    <button class="close-modal" onclick="closeImageModal()">
      ×
    </button>

    <img
      id="modalImage"
      class="modal-image"
      alt="Product image"
    >

  </div>


  <script>

    const params = new URLSearchParams(window.location.search);

    const productId = params.get("id");

    let productImages = [];

    let currentImageIndex = 0;


    async function loadProduct() {

      const productContent =
        document.getElementById("productContent");


      if (!productId) {

        showError(
          "Product not found",
          "We couldn't find the piece you're looking for."
        );

        return;

      }


      const { data: product, error } =
        await supabaseClient
          .from("products")
          .select("*")
          .eq("id", productId)
          .single();


      if (error || !product) {

        console.error(error);

        showError(
          "Something went wrong",
          "This product is currently unavailable."
        );

        return;

      }


      const productName =
        product.name ||
        product.title ||
        "OnlyHers Design";


      const productPrice =
        product.price ?? 0;


      const productDescription =
        product.description ||
        "Thoughtfully designed to feel comfortable, personal, and uniquely hers.";


      const productCategory =
        product.category ||
        "OnlyHers Collection";


      /* =========================
         MULTIPLE IMAGES
      ========================= */

      productImages = [];


      // Add main image first

      if (product.image_url) {

        productImages.push(product.image_url);

      }


      // Add image_urls array

      if (Array.isArray(product.image_urls)) {

        product.image_urls.forEach(url => {

          if (
            url &&
            !productImages.includes(url)
          ) {
            productImages.push(url);
          }

        });

      }


      // Fallback for old image column

      if (
        productImages.length === 0 &&
        product.image
      ) {

        productImages.push(product.image);

      }


      /* =========================
         SIZES
      ========================= */

      const sizes =
        product.sizes ||
        product.available_sizes ||
        product.size ||
        "";


      let sizeArray = [];


      if (Array.isArray(sizes)) {

        sizeArray = sizes;

      }

      else if (typeof sizes === "string") {

        sizeArray =
          sizes
            .split(",")
            .map(size => size.trim())
            .filter(Boolean);

      }


      const sizesHTML =
        sizeArray.length

          ? sizeArray.map(size => `
              <button
                class="size-btn"
                data-size="${escapeHTML(size)}"
              >
                ${escapeHTML(size)}
              </button>
            `).join("")

          : `<span style="opacity:.6">
               Sizes coming soon
             </span>`;


      /* =========================
         DISPLAY PRODUCT
      ========================= */

      productContent.innerHTML = `

        <div class="product-container">


          <!-- GALLERY -->

          <div class="gallery">

            <div class="main-image-container">

              <img
                id="mainProductImage"
                class="main-image"
                src="${escapeHTML(productImages[0] || "")}"
                alt="${escapeHTML(productName)}"
                onclick="openImageModal()"
              >

              ${productImages.length > 1 ? `

                <button
                  class="gallery-arrow prev-image"
                  onclick="previousImage()"
                >
                  ‹
                </button>

                <button
                  class="gallery-arrow next-image"
                  onclick="nextImage()"
                >
                  ›
                </button>

              ` : ""}


              <div
                class="image-counter"
                id="imageCounter"
              >
                1 / ${productImages.length || 1}
              </div>

            </div>


            <div
              class="thumbnails"
              id="thumbnails"
            >

              ${productImages.map((image, index) => `

                <button
                  class="thumbnail ${
                    index === 0 ? "active" : ""
                  }"

                  onclick="changeImage(${index})"
                >

                  <img
                    src="${escapeHTML(image)}"
                    alt="${escapeHTML(productName)} view ${index + 1}"
                  >

                </button>

              `).join("")}

            </div>

          </div>


          <!-- DETAILS -->

          <div class="product-details">

            <div class="product-category">
              ${escapeHTML(productCategory)}
            </div>


            <h1 class="product-name">
              ${escapeHTML(productName)}
            </h1>


            <div class="product-price">
              ₹${Number(productPrice).toLocaleString("en-IN")}
            </div>


            <div class="product-line"></div>


            <p class="product-description">
              ${escapeHTML(productDescription)}
            </p>


            <div class="size-title">
              Select your size
            </div>


            <div class="sizes">
              ${sizesHTML}
            </div>


            <button
              class="order-btn"
              id="orderBtn"
            >
              Enquire about this piece
            </button>


            <p class="product-note">
              Every piece is thoughtfully made for her.
            </p>

          </div>


        </div>

      `;


      setupSizeSelection(productName, productPrice);

    }


    /* =========================
       IMAGE FUNCTIONS
    ========================= */

    function changeImage(index) {

      if (!productImages[index]) return;

      currentImageIndex = index;

      const mainImage =
        document.getElementById("mainProductImage");


      mainImage.style.opacity = "0";


      setTimeout(() => {

        mainImage.src =
          productImages[index];

        mainImage.style.opacity = "1";

      }, 150);


      document
        .querySelectorAll(".thumbnail")
        .forEach((thumbnail, i) => {

          thumbnail.classList.toggle(
            "active",
            i === index
          );

        });


      const counter =
        document.getElementById("imageCounter");


      if (counter) {

        counter.textContent =
          `${index + 1} / ${productImages.length}`;

      }

    }


    function nextImage() {

      const next =
        (currentImageIndex + 1) %
        productImages.length;

      changeImage(next);

    }


    function previousImage() {

      const previous =
        (
          currentImageIndex - 1 +
          productImages.length
        ) %
        productImages.length;

      changeImage(previous);

    }


    /* =========================
       IMAGE MODAL
    ========================= */

    function openImageModal() {

      const modal =
        document.getElementById("imageModal");

      const image =
        document.getElementById("modalImage");


      image.src =
        productImages[currentImageIndex];


      modal.classList.add("open");

    }


    function closeImageModal() {

      document
        .getElementById("imageModal")
        .classList
        .remove("open");

    }


    document
      .getElementById("imageModal")
      .addEventListener("click", function(event) {

        if (event.target === this) {

          closeImageModal();

        }

      });


    /* =========================
       SIZE + WHATSAPP
    ========================= */

    function setupSizeSelection(
      productName,
      productPrice
    ) {

      const sizeButtons =
        document.querySelectorAll(".size-btn");


      sizeButtons.forEach(button => {

        button.addEventListener("click", () => {

          sizeButtons.forEach(btn =>
            btn.classList.remove("active")
          );

          button.classList.add("active");

        });

      });


      document
        .getElementById("orderBtn")
        .addEventListener("click", () => {

          const selectedSize =
            document.querySelector(
              ".size-btn.active"
            );


          const sizeText =
            selectedSize
              ? selectedSize.dataset.size
              : "Not selected";


          const message = `Hi OnlyHers! 👋

I'm interested in:

${productName}

Price: ₹${productPrice}

Size: ${sizeText}

Could you please share more details?`;


          /*
            CHANGE THIS TO
            YOUR WHATSAPP NUMBER
          */

          const whatsappNumber =
            "919059828206";


          window.open(
            `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`,
            "_blank"
          );

        });

    }


    /* =========================
       ERROR
    ========================= */

    function showError(title, message) {

      document.getElementById(
        "productContent"
      ).innerHTML = `

        <div class="error-message">

          <h2>${escapeHTML(title)}</h2>

          <p>${escapeHTML(message)}</p>

          <a
            href="collection.html"
            class="collection-btn"
            style="
              color:white;
              text-decoration:none;
              display:inline-block;
            "
          >
            BACK TO COLLECTION
          </a>

        </div>

      `;

    }


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHTML(value) {

      if (
        value === null ||
        value === undefined
      ) return "";

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    loadProduct();

  </script>

</body>
</html>
