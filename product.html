<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Product | OnlyHers</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: #8f0d1b;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* =========================
       BACKGROUND DECORATION
    ========================= */

    .bg-shape {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
      filter: blur(2px);
      opacity: 0.25;
    }

    .shape-one {
      width: 500px;
      height: 500px;
      border: 1px solid #f3caca;
      top: -250px;
      right: -180px;
      animation: floatShape 12s ease-in-out infinite;
    }

    .shape-two {
      width: 350px;
      height: 350px;
      border: 1px solid #f3caca;
      bottom: -150px;
      left: -120px;
      animation: floatShape 10s ease-in-out infinite reverse;
    }

    @keyframes floatShape {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }

      50% {
        transform: translateY(30px) rotate(10deg);
      }
    }

    /* =========================
       HEADER
    ========================= */

    header {
      width: 100%;
      padding: 22px 7%;
      background: #b51f2c;
      border-bottom: 1px solid rgba(255,255,255,0.12);

      display: flex;
      justify-content: space-between;
      align-items: center;

      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .logo {
      text-decoration: none;
      color: white;
      font-family: "Playfair Display", serif;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -1px;
    }

    .logo span {
      font-family: "Great Vibes", cursive;
      font-size: 34px;
      margin-left: 4px;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    nav a {
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 0.5px;
      transition: 0.3s;
    }

    nav a:hover {
      color: white;
    }

    .collection-btn {
      border: 1px solid rgba(255,255,255,0.7);
      padding: 11px 20px;
      transition: 0.3s;
    }

    .collection-btn:hover {
      background: white;
      color: #8f0d1b;
    }


    /* =========================
       PRODUCT SECTION
    ========================= */

    .product-page {
      max-width: 1250px;
      margin: auto;
      padding: 70px 30px 100px;

      min-height: 80vh;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      color: rgba(255,255,255,0.8);
      text-decoration: none;

      margin-bottom: 45px;
      font-size: 14px;

      transition: 0.3s;
    }

    .back-link:hover {
      color: white;
      transform: translateX(-5px);
    }


    .product-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: center;

      animation: fadeUp 0.8s ease forwards;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(35px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    /* =========================
       IMAGE
    ========================= */

    .product-image-wrapper {
      position: relative;
    }

    .product-image-wrapper::before {
      content: "";
      position: absolute;

      width: 100%;
      height: 100%;

      border: 1px solid rgba(255,255,255,0.3);

      top: 18px;
      left: 18px;

      z-index: -1;
    }

    .product-image {
      width: 100%;
      aspect-ratio: 4 / 5;

      object-fit: cover;

      background: #a51b28;

      display: block;

      transition: transform 0.6s ease;
    }

    .product-image:hover {
      transform: scale(1.015);
    }


    /* =========================
       PRODUCT DETAILS
    ========================= */

    .product-category {
      font-size: 12px;

      letter-spacing: 3px;
      text-transform: uppercase;

      color: #f2c7c7;

      margin-bottom: 18px;
    }

    .product-name {
      font-family: "Playfair Display", serif;

      font-size: clamp(40px, 5vw, 68px);
      line-height: 1.05;

      margin-bottom: 25px;
    }

    .product-price {
      font-size: 22px;
      font-weight: 500;

      margin-bottom: 30px;

      color: #fff;
    }

    .product-line {
      width: 100%;
      height: 1px;

      background: rgba(255,255,255,0.2);

      margin-bottom: 30px;
    }

    .product-description {
      color: rgba(255,255,255,0.82);

      font-size: 16px;
      line-height: 1.8;

      margin-bottom: 35px;

      max-width: 550px;
    }


    /* =========================
       SIZE SECTION
    ========================= */

    .size-title {
      font-size: 13px;

      letter-spacing: 1.5px;
      text-transform: uppercase;

      margin-bottom: 18px;
    }

    .sizes {
      display: flex;
      flex-wrap: wrap;

      gap: 10px;

      margin-bottom: 38px;
    }

    .size-btn {
      min-width: 52px;
      padding: 13px 16px;

      background: transparent;

      border: 1px solid rgba(255,255,255,0.5);

      color: white;

      cursor: pointer;

      font-family: "DM Sans", sans-serif;

      transition: 0.3s;
    }

    .size-btn:hover,
    .size-btn.active {
      background: white;
      color: #8f0d1b;
      border-color: white;
    }


    /* =========================
       BUTTON
    ========================= */

    .order-btn {
      width: 100%;

      padding: 19px;

      border: none;

      background: #fff;
      color: #8f0d1b;

      font-family: "DM Sans", sans-serif;

      font-size: 13px;
      font-weight: 700;

      letter-spacing: 2px;

      text-transform: uppercase;

      cursor: pointer;

      transition: all 0.35s ease;
    }

    .order-btn:hover {
      background: #161616;
      color: white;

      transform: translateY(-3px);

      box-shadow: 0 15px 30px rgba(0,0,0,0.2);
    }

    .product-note {
      margin-top: 18px;

      font-size: 12px;

      color: rgba(255,255,255,0.6);

      text-align: center;
    }


    /* =========================
       LOADING
    ========================= */

    .loading {
      text-align: center;
      padding: 120px 20px;

      font-family: "Playfair Display", serif;
      font-size: 28px;
    }

    .error-message {
      text-align: center;
      padding: 100px 20px;
    }

    .error-message h2 {
      font-family: "Playfair Display", serif;
      font-size: 42px;

      margin-bottom: 20px;
    }

    .error-message p {
      color: rgba(255,255,255,0.75);
      margin-bottom: 30px;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #720814;

      padding: 60px 7% 35px;

      text-align: center;

      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .footer-brand {
      font-family: "Playfair Display", serif;

      font-size: 32px;

      margin-bottom: 8px;
    }

    .hers-by {
      font-family: "Great Vibes", cursive;

      font-size: 30px;

      color: #f3c7c7;

      margin-bottom: 20px;
    }

    .footer-text {
      color: rgba(255,255,255,0.6);

      font-size: 13px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      header {
        padding: 18px 6%;
      }

      nav {
        gap: 15px;
      }

      nav a:not(.collection-btn) {
        display: none;
      }

      .product-page {
        padding: 45px 20px 70px;
      }

      .product-container {
        grid-template-columns: 1fr;
        gap: 55px;
      }

      .product-name {
        font-size: 48px;
      }

      .product-image-wrapper::before {
        top: 10px;
        left: 10px;
      }

    }

  </style>
</head>


<body>

  <!-- Background decoration -->

  <div class="bg-shape shape-one"></div>
  <div class="bg-shape shape-two"></div>


  <!-- HEADER -->

  <header>

    <a href="index.html" class="logo">
      Only<span>Hers</span>
    </a>

    <nav>
      <a href="index.html">Home</a>
      <a href="collection.html" class="collection-btn">
        Collection
      </a>
    </nav>

  </header>


  <!-- PRODUCT -->

  <main class="product-page">

    <a href="collection.html" class="back-link">
      ← Back to collection
    </a>


    <div id="productContent">

      <div class="loading">
        Loading your piece...
      </div>

    </div>

  </main>


  <!-- FOOTER -->

  <footer>

    <div class="footer-brand">
      OnlyHers
    </div>

    <div class="hers-by">
      Hers by Hari Venkatesh
    </div>

    <p class="footer-text">
      © 2026 OnlyHers. Thoughtfully designed fashion made to feel like yours.
    </p>

  </footer>


  <!-- SUPABASE SCRIPT -->

  <script>

    const SUPABASE_URL = "https://zeodtbgxadxfvexvywpm.supabase.co";

    const SUPABASE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";


    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    // GET PRODUCT ID FROM URL

    const params = new URLSearchParams(window.location.search);

    const productId = params.get("id");


    async function loadProduct() {

      const productContent =
        document.getElementById("productContent");


      // If no product ID

      if (!productId) {

        productContent.innerHTML = `

          <div class="error-message">

            <h2>Product not found</h2>

            <p>
              We couldn't find the piece you're looking for.
            </p>

            <a href="collection.html" class="collection-btn"
               style="display:inline-block; color:white; text-decoration:none;">
              VIEW COLLECTION
            </a>

          </div>

        `;

        return;
      }


      // FETCH PRODUCT FROM SUPABASE

      const { data: product, error } =
        await supabaseClient
          .from("products")
          .select("*")
          .eq("id", productId)
          .single();


      if (error || !product) {

        console.error(error);


        productContent.innerHTML = `

          <div class="error-message">

            <h2>Something went wrong</h2>

            <p>
              This product is currently unavailable.
            </p>

            <a href="collection.html"
               class="collection-btn"
               style="display:inline-block; color:white; text-decoration:none;">
              BACK TO COLLECTION
            </a>

          </div>

        `;

        return;
      }


      // SUPPORT DIFFERENT COLUMN NAMES

      const productName =
        product.name ||
        product.title ||
        "OnlyHers Design";


      const productPrice =
        product.price || 0;


      const productDescription =
        product.description ||
        "Thoughtfully designed to feel comfortable, personal, and uniquely hers.";


      const productCategory =
        product.category ||
        "OnlyHers Collection";


      const productImage =
        product.image_url ||
        product.image ||
        product.imageUrl ||
        "";


      const sizes =
        product.sizes ||
        product.available_sizes ||
        product.size ||
        "";


      // CONVERT SIZES TO ARRAY

      let sizeArray = [];


      if (Array.isArray(sizes)) {

        sizeArray = sizes;

      } else if (typeof sizes === "string") {

        sizeArray = sizes
          .split(",")
          .map(size => size.trim())
          .filter(size => size);

      }


      // CREATE SIZE BUTTONS

      let sizesHTML = "";


      if (sizeArray.length > 0) {

        sizeArray.forEach(size => {

          sizesHTML += `

            <button class="size-btn">
              ${size}
            </button>

          `;

        });

      } else {

        sizesHTML = `

          <span style="color:rgba(255,255,255,0.6)">
            Sizes coming soon
          </span>

        `;

      }


      // DISPLAY PRODUCT

      productContent.innerHTML = `

        <div class="product-container">


          <!-- IMAGE -->

          <div class="product-image-wrapper">

            <img
              src="${productImage}"
              alt="${productName}"
              class="product-image"
              onerror="this.src='https://placehold.co/600x750/9b1422/ffffff?text=OnlyHers'"
            >

          </div>



          <!-- DETAILS -->

          <div class="product-details">


            <div class="product-category">

              ${productCategory}

            </div>


            <h1 class="product-name">

              ${productName}

            </h1>


            <div class="product-price">

              ₹${Number(productPrice).toLocaleString("en-IN")}

            </div>


            <div class="product-line"></div>


            <p class="product-description">

              ${productDescription}

            </p>


            <div class="size-title">

              Select your size

            </div>


            <div class="sizes">

              ${sizesHTML}

            </div>


            <button class="order-btn" id="orderBtn">

              Enquire about this piece

            </button>


            <p class="product-note">

              Every piece is thoughtfully made for her.

            </p>


          </div>


        </div>

      `;


      // SIZE SELECTION

      const sizeButtons =
        document.querySelectorAll(".size-btn");


      sizeButtons.forEach(button => {

        button.addEventListener("click", () => {

          sizeButtons.forEach(btn =>
            btn.classList.remove("active")
          );

          button.classList.add("active");

        });

      });


      // ORDER / ENQUIRY BUTTON

      document
        .getElementById("orderBtn")
        .addEventListener("click", () => {

          const selectedSize =
            document.querySelector(".size-btn.active");


          const sizeText =
            selectedSize
              ? selectedSize.textContent.trim()
              : "Not selected";


          const message = `Hi OnlyHers! 👋

I'm interested in:

${productName}

Price: ₹${productPrice}

Size: ${sizeText}

Could you please share more details?`;


          // CHANGE THIS NUMBER TO YOUR WHATSAPP NUMBER

          const whatsappNumber =
            "91XXXXXXXXXX";


          window.open(

            `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`,

            "_blank"

          );

        });

    }


    // LOAD PRODUCT

    loadProduct();

  </script>

</body>
</html>
