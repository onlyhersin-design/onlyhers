  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 100%;
      overflow-x: clip;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 100dvh;
      margin: 0;
      display: flex;
      flex-direction: column;
      font-family: "DM Sans", sans-serif;
      /* Keep the maroon background consistent across the full mobile width.
         The previous lower-right radial shadow created a visible dark vertical patch. */
      background:
        radial-gradient(circle at 50% 0%, rgba(210,60,70,.16), transparent 42%),
        linear-gradient(180deg, #970f1e 0%, #8f0d1b 100%);

      color: white;
      min-height: 100dvh;
      overflow-x: clip;
    }

    /* HEADER */

    header {
      width: 100%;
      max-width: 100%;
      left: 0;
      right: 0;
      padding: 20px 7%;
      background: rgba(35, 10, 13, .32);
      -webkit-backdrop-filter: blur(18px) saturate(125%);
      backdrop-filter: blur(18px) saturate(125%);
      border-bottom: 1px solid rgba(255,255,255,.16);
      box-shadow: 0 8px 28px rgba(0,0,0,.10);

      display: flex;
      align-items: center;
      justify-content: space-between;

      position: fixed;
      top: 0;
      z-index: 100;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-family: "Playfair Display", serif;
      font-size: 30px;
      font-weight: 600;
    }

    .logo span {
      font-family: "Great Vibes", cursive;
      font-size: 34px;
      margin-left: 3px;
    }

    nav {
      display: flex;
      gap: 25px;
      align-items: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 14px;
      opacity: .9;
    }

    .collection-btn {
      border: 1px solid rgba(255,255,255,.7);
      padding: 10px 18px;
    }

    /* PAGE */

    .product-page {
      width: 100%;
      max-width: 1300px;
      min-width: 0;
      margin: 0 auto;
      padding: 135px 30px 100px;
      flex: 1 0 auto;
    }

    .back-link {
      display: inline-block;
      color: rgba(255,255,255,.8);
      text-decoration: none;
      margin-bottom: 40px;
      transition: .3s;
    }

    .back-link:hover {
      transform: translateX(-5px);
      color: white;
    }

    .product-container {
      width: 100%;
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 80px;
      align-items: start;

      animation: fadeUp .7s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       IMAGE GALLERY
    ========================= */

    .gallery {
      width: 100%;
      min-width: 0;
    }

    .main-image-container {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      background: rgba(255,255,255,.08);
    }

    .main-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      display: block;
      cursor: zoom-in;
      transition: opacity .3s ease, transform .5s ease;
    }

    .main-image:hover {
      transform: scale(1.02);
    }

    /* Gallery arrows */

    .gallery-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);

      width: 48px;
      height: 48px;

      border: 1px solid rgba(255,255,255,.5);
      background: rgba(80,0,10,.5);

      color: white;
      font-size: 25px;

      cursor: pointer;
      z-index: 5;

      transition: .3s;
    }

    .gallery-arrow:hover {
      background: white;
      color: #8f0d1b;
    }

    .prev-image {
      left: 15px;
    }

    .next-image {
      right: 15px;
    }

    /* Image counter */

    .image-counter {
      position: absolute;
      bottom: 18px;
      right: 18px;

      background: rgba(0,0,0,.5);
      backdrop-filter: blur(10px);

      padding: 7px 12px;
      font-size: 12px;
      z-index: 5;
    }

    /* THUMBNAILS */

    .thumbnails {
      display: flex;
      gap: 12px;
      margin-top: 18px;

      overflow-x: auto;
      padding-bottom: 5px;
    }

    .thumbnail {
      flex: 0 0 82px;
      width: 82px;
      height: 105px;

      border: 1px solid transparent;
      padding: 0;
      background: transparent;

      cursor: pointer;
      overflow: hidden;

      opacity: .65;
      transition: .3s;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumbnail:hover {
      opacity: 1;
    }

    .thumbnail.active {
      opacity: 1;
      border: 2px solid white;
    }
    .instagram-post-section { margin-top: 30px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,.16); }
    .instagram-post-heading { margin-bottom: 14px; color: rgba(255,255,255,.72); font-size: 10px; letter-spacing: 2px; font-weight: 700; }
    .instagram-embed-host { width: min(540px, 100%); max-width: 100%; overflow: hidden; }
    .instagram-embed-host blockquote.instagram-media { width: 100% !important; min-width: 0 !important; max-width: 540px !important; margin: 0 !important; }
    .instagram-post-link { display: inline-block; margin-top: 13px; color: #fff; font-size: 11px; text-decoration: underline; text-underline-offset: 4px; }
    .social-thumb-label { position:absolute;left:4px;right:4px;bottom:4px;padding:4px 3px;background:rgba(0,0,0,.65);color:#fff;font-size:8px;letter-spacing:1px;text-transform:uppercase;text-align:center; }
    .thumbnail { position:relative; }

    /* PRODUCT DETAILS */

    .product-details {
      width: 100%;
      min-width: 0;
    }

    .product-label-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .product-category {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #f4c7cb;
    }

    .product-code {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      margin: 0;
      padding: 7px 11px;
      border: 1px solid rgba(255,255,255,.28);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.88);
      font-size: 11px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .product-name {
      font-family: "Playfair Display", serif;
      font-size: clamp(42px, 5vw, 68px);
      line-height: 1.05;
      margin-bottom: 20px;
    }

    .product-price {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 30px;
    }

    .stock-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: -14px 0 28px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }
    .stock-status::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: currentColor;
    }
    .stock-status.in-stock { color: #c9f7d2; }
    .stock-status.out-of-stock { color: #ffd0d0; }

    .stock-controls { display:none; gap:10px; margin:-8px 0 28px; }
    .stock-controls.visible { display:flex; }
    .stock-option { flex:1; min-height:42px; padding:10px 14px; border:1px solid rgba(255,255,255,.35); background:transparent; color:white; font:600 11px "DM Sans",sans-serif; letter-spacing:1px; text-transform:uppercase; cursor:pointer; transition:.25s ease; }
    .stock-option:hover { background:rgba(255,255,255,.1); }
    .stock-option.active { background:white; color:#8f0d1b; border-color:white; }
    .stock-option:disabled { opacity:.55; cursor:wait; }

    .product-line {
      height: 1px;
      background: rgba(255,255,255,.2);
      margin-bottom: 30px;
    }

    .product-description {
      color: rgba(255,255,255,.82);
      line-height: 1.8;
      font-size: 16px;
      margin-bottom: 35px;
    }

    /* SIZES */

    .size-title {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    .sizes {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 35px;
    }

    .size-btn {
      min-width: 55px;
      padding: 13px 16px;

      background: transparent;
      border: 1px solid rgba(255,255,255,.5);

      color: white;
      cursor: pointer;

      transition: .3s;
    }

    .size-btn.active,
    .size-btn:hover {
      background: white;
      color: #8f0d1b;
    }

    .size-chart-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: -18px 0 34px;
      padding: 10px 14px;
      background: transparent;
      border: 1px solid rgba(255,255,255,.45);
      color: white;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: .5px;
    }

    .size-chart-btn:hover {
      background: white;
      color: #8f0d1b;
    }

    .details-accordion {
      border-top: 1px solid rgba(255,255,255,.2);
      margin: 8px 0 28px;
    }

    .details-item {
      border-bottom: 1px solid rgba(255,255,255,.2);
    }

    .details-summary {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 17px 0;
      background: transparent;
      border: 0;
      color: white;
      font: inherit;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }

    .details-summary span:last-child {
      font-size: 22px;
      font-weight: 400;
      transition: transform .25s ease;
    }

    .details-item.open .details-summary span:last-child {
      transform: rotate(45deg);
    }

    .details-content {
      display: none;
      padding: 0 0 18px;
      color: rgba(255,255,255,.78);
      line-height: 1.7;
      font-size: 14px;
      white-space: pre-line;
    }

    .details-item.open .details-content {
      display: block;
    }

    /* BUTTON */

    .order-btn {
      width: 100%;
      padding: 19px;

      border: none;
      background: white;
      color: #8f0d1b;

      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;

      cursor: pointer;
      transition: .3s;
    }

    .order-btn:hover {
      background: #1a1113;
      color: white;
      transform: translateY(-2px);
    }

    .product-note {
      text-align: center;
      margin-top: 15px;
      color: rgba(255,255,255,.6);
      font-size: 12px;
    }

    /* LOADING / ERROR */

    .loading,
    .error-message {
      text-align: center;
      padding: 100px 20px;
      grid-column: 1 / -1;
    }

    .error-message h2 {
      font-family: "Playfair Display", serif;
      font-size: 42px;
      margin-bottom: 15px;
    }

    /* IMAGE MODAL */

    .image-modal {
      display: none;

      position: fixed;
      inset: 0;

      background: rgba(0,0,0,.93);

      z-index: 1000;

      align-items: center;
      justify-content: center;

      padding: 30px;
    }

    .image-modal.open {
      display: flex;
    }

    .modal-image {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
    }

    .close-modal {
      position: absolute;
      top: 25px;
      right: 30px;

      background: transparent;
      border: none;

      color: white;
      font-size: 38px;
      cursor: pointer;
    }

    /* FOOTER */

    footer {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      margin: 0;
      flex: 0 0 auto;
      background: #670914;
      padding: 60px 20px 35px;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,.1);
    }

    .footer-brand {
      font-family: "Playfair Display", serif;
      font-size: 32px;
    }

    .hers-by {
      font-family: "Great Vibes", cursive;
      font-size: 32px;
      color: #f3c7c7;
      margin: 10px 0 18px;
    }

    .footer-text {
      font-size: 13px;
      color: rgba(255,255,255,.6);
    }

    /* MOBILE */

    @media (max-width: 850px) {

      /* One fixed mobile layout for every product */
      header {
        width: 100%;
        max-width: 100%;
        padding: 18px 6%;
      }

      nav a:first-child {
        display: none;
      }

      .product-page {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        margin: 0;
        padding: 118px 20px 70px;
        overflow-x: clip;
      }

      .back-link {
        margin-bottom: 24px;
      }

      .product-container {
        width: 100%;
        min-width: 0;
        grid-template-columns: minmax(0, 1fr);
        gap: 34px;
        align-items: start;
      }

      .gallery {
        width: 100%;
        max-width: 620px;
        margin: 0 auto;
      }

      .main-image-container {
        width: 100%;
        aspect-ratio: 4 / 5;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .main-image {
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center center;
      }

      .main-image:hover {
        transform: none;
      }

      .thumbnails {
        width: 100%;
        justify-content: flex-start;
        align-items: center;
        flex-wrap: nowrap;
        overflow-x: auto;
        max-width: 100%;
        padding-bottom: 4px;
        -webkit-overflow-scrolling: touch;
      }

      .product-details {
        width: 100%;
        max-width: 620px;
        min-width: 0;
        margin: 0 auto;
        text-align: left;
      }

      .product-label-row {
        justify-content: flex-start;
      }

      .product-category,
      .product-description,
      .size-title,
      .product-note,
      .product-name {
        width: 100%;
        text-align: left;
      }

      .product-description {
        margin-left: 0;
        margin-right: 0;
      }

      .product-name {
        font-size: clamp(40px, 12vw, 48px);
      }

      .sizes {
        justify-content: flex-start;
        align-items: flex-start;
        gap: 8px;
      }

      .size-btn {
        min-width: 0;
        flex: 0 0 auto;
        min-height: 46px;
        padding: 8px 15px;
        font-size: 14px;
      }

      .size-chart-btn {
        margin-left: auto;
        margin-right: auto;
      }

      .details-accordion {
        text-align: left;
      }

      .order-btn {
        max-width: 100%;
      }

      footer {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        margin: 0;
        padding: 70px 24px calc(38px + env(safe-area-inset-bottom));
        overflow-x: clip;
      }

      .footer-brand,
      .hers-by,
      .footer-text {
        width: 100%;
        max-width: 100%;
        margin-left: auto;
        margin-right: auto;
        text-align: center;
      }

      .footer-text {
        overflow-wrap: anywhere;
      }

      .thumbnail {
        flex: 0 0 68px;
        width: 68px;
        height: 88px;
      }

    }

  </style>

  <script>

    const params = new URLSearchParams(window.location.search);

    const productId = params.get("id");
    if (!productId) {
      const robotsMeta = document.querySelector('meta[name="robots"]');
      if (robotsMeta) robotsMeta.content = "noindex, follow";
    }

    let productImages = [];
    let productSocialLinks = {};
    let currentImageIndex = 0;

    function getInstagramPostUrl(value) {
      try {
        const url = new URL(String(value || "").trim());
        if (url.protocol !== "https:" || !["instagram.com", "www.instagram.com"].includes(url.hostname)) return "";
        const match = url.pathname.match(/^\/(p|reel|tv)\/([A-Za-z0-9_-]+)\/?$/);
        return match ? "https://www.instagram.com/" + match[1] + "/" + match[2] + "/" : "";
      } catch { return ""; }
    }

    function processInstagramEmbed() {
      const host = document.getElementById("instagramEmbedBlock");
      if (!host) return;
      if (window.instgrm && window.instgrm.Embeds) {
        window.instgrm.Embeds.process();
        return;
      }
      let script = document.getElementById("instagram-embed-script");
      if (!script) {
        script = document.createElement("script");
        script.id = "instagram-embed-script";
        script.async = true;
        script.src = "https://www.instagram.com/embed.js";
        script.onload = () => window.instgrm?.Embeds?.process();
        document.body.appendChild(script);
      } else {
        script.addEventListener("load", () => window.instgrm?.Embeds?.process(), { once: true });
      }
    }


    async function loadProduct() {

      const productContent =
        document.getElementById("productContent");


      if (!productId) {

        showError(
          "Product not found",
          "We couldn't find the piece you're looking for."
        );

        return;

      }


      const response = await fetch("/api/products/" + encodeURIComponent(productId), { headers: { accept: "application/json" } });
      if (!response.ok) {
        showError("Something went wrong", "This product is currently unavailable.");
        return;
      }
      const product = await response.json();


      const productName =
        product.name ||
        product.title ||
        "onlyhers Design";


      const productPrice =
        product.price ?? 0;


      const productDescription =
        product.description ||
        "Thoughtfully designed to feel comfortable, personal, and uniquely hers.";


      const productCategory =
        product.category ||
        "onlyhers Collection";

      const productUrl =
        window.location.origin + "/product.html?id=" + encodeURIComponent(product.id);

      const primaryImage =
        product.image_url ||
        (Array.isArray(product.image_urls) ? product.image_urls[0] : "") ||
        product.instagram_photo_url ||
        product.youtube_photo_url ||
        "";

      document.title = productName + " | onlyhers";

      const metaDescription = document.getElementById("metaDescription");
      const canonicalUrl = document.getElementById("canonicalUrl");
      const ogTitle = document.getElementById("ogTitle");
      const ogDescription = document.getElementById("ogDescription");
      const ogUrl = document.getElementById("ogUrl");
      const ogImage = document.getElementById("ogImage");
      const twitterTitle = document.getElementById("twitterTitle");
      const twitterDescription = document.getElementById("twitterDescription");
      const twitterImage = document.getElementById("twitterImage");

      if (metaDescription) metaDescription.setAttribute("content", productDescription.replace(/\\s+/g, " ").slice(0, 160));
      if (canonicalUrl) canonicalUrl.setAttribute("href", productUrl);
      if (ogTitle) ogTitle.setAttribute("content", productName);
      if (ogDescription) ogDescription.setAttribute("content", productDescription);
      if (ogUrl) ogUrl.setAttribute("content", productUrl);
      if (ogImage && primaryImage) ogImage.setAttribute("content", primaryImage);
      if (twitterTitle) twitterTitle.setAttribute("content", productName);
      if (twitterDescription) twitterDescription.setAttribute("content", productDescription);
      if (twitterImage && primaryImage) twitterImage.setAttribute("content", primaryImage);

      const productCode = product.product_code || "";
      const productMaterial = product.material || "";
      const productWashCare = product.wash_care || "";
      const productMoreDetails = product.more_details || "";
      const sizeChartUrl = product.size_chart_url || "";
      const instagramPostUrl = getInstagramPostUrl(product.instagram_link);
      productSocialLinks = {};

      const productSchemaImages = [...new Set([
        product.image_url,
        ...(Array.isArray(product.image_urls) ? product.image_urls : []),
        product.instagram_photo_url,
        product.youtube_photo_url
      ].filter(url => typeof url === "string" && url.trim()))];

      const productStructuredData = {
        "@context": "https://schema.org",
        "@type": "Product",
        "@id": productUrl + "#product",
        "url": productUrl,
        "name": productName,
        "description": productDescription,
        ...(productSchemaImages.length ? { "image": productSchemaImages } : {}),
        "sku": productCode || String(product.id),
        "brand": {
          "@type": "Brand",
          "name": "onlyhers"
        },
        "category": productCategory,
        ...(productMaterial ? { "material": productMaterial } : {}),
        ...(Number(productPrice) > 0 ? {
          "offers": {
            "@type": "Offer",
            "url": productUrl,
            "priceCurrency": "INR",
            "price": Number(productPrice).toFixed(2),
            "availability": product.is_available !== false
              ? "https://schema.org/InStock"
              : "https://schema.org/OutOfStock",
            "itemCondition": "https://schema.org/NewCondition",
            "seller": {
              "@type": "Organization",
              "name": "onlyhers",
              "url": "https://onlyhers.in/"
            }
          }
        } : {})
      };

      const structuredDataElement = document.getElementById("productStructuredData");
      if (structuredDataElement) {
        structuredDataElement.textContent = JSON.stringify(productStructuredData);
      }


      /* =========================
         MULTIPLE IMAGES
      ========================= */

      productImages = [];


      // Add main image first

      if (product.image_url) {

        productImages.push(product.image_url);

      }


      // Add image_urls array

      if (Array.isArray(product.image_urls)) {

        product.image_urls.forEach(url => {

          if (
            url &&
            !productImages.includes(url)
          ) {
            productImages.push(url);
          }

        });

      }


      // Fallback for old image column

      if (
        productImages.length === 0 &&
        product.image
      ) {

        productImages.push(product.image);

      }

      if (product.instagram_photo_url) {
        productSocialLinks[productImages.length] = { platform: "Instagram", link: product.instagram_link || "" };
        productImages.push(product.instagram_photo_url);
      }
      if (product.youtube_photo_url) {
        productSocialLinks[productImages.length] = { platform: "YouTube", link: product.youtube_link || "" };
        productImages.push(product.youtube_photo_url);
      }


      /* =========================
         SIZES
      ========================= */

      const sizes =
        product.sizes ||
        product.available_sizes ||
        product.size ||
        "";


      let sizeArray = [];


      if (Array.isArray(sizes)) {

        sizeArray = sizes;

      }

      else if (typeof sizes === "string") {

        sizeArray =
          sizes
            .split(",")
            .map(size => size.trim())
            .filter(Boolean);

      }


      const sizesHTML =
        sizeArray.length

          ? sizeArray.map(size => `
              <button
                class="size-btn"
                data-size="${escapeHTML(size)}"
              >
                ${escapeHTML(size)}
              </button>
            `).join("")

          : `<span style="opacity:.6">
               Sizes coming soon
             </span>`;


      /* =========================
         DISPLAY PRODUCT
      ========================= */

      productContent.innerHTML = `

        <div class="product-container">


          <!-- GALLERY -->

          <div class="gallery">

            <div class="main-image-container">

              <img
                id="mainProductImage"
                class="main-image"
                src="${escapeHTML(productImages[0] || "")}"
                alt="${escapeHTML(productName)}"
                onclick="handleMainImageClick()"
              >

              ${productImages.length > 1 ? `

                <button
                  class="gallery-arrow prev-image"
                  onclick="previousImage()"
                >
                  ‹
                </button>

                <button
                  class="gallery-arrow next-image"
                  onclick="nextImage()"
                >
                  ›
                </button>

              ` : ""}


              <div
                class="image-counter"
                id="imageCounter"
              >
                1 / ${productImages.length || 1}
              </div>

            </div>


            <div
              class="thumbnails"
              id="thumbnails"
            >

              ${productImages.map((image, index) => `

                <button
                  class="thumbnail ${
                    index === 0 ? "active" : ""
                  }"

                  onclick="changeImage(${index})"
                >

                  <img
                    src="${escapeHTML(image)}"
                    alt="${escapeHTML(productName)} view ${index + 1}"
                  >${productSocialLinks[index] ? `<span class="social-thumb-label">${escapeHTML(productSocialLinks[index].platform)}</span>` : ""}

                </button>

              `).join("")}

            </div>

          </div>


          <!-- DETAILS -->

          <div class="product-details">

            <div class="product-label-row">
              <div class="product-category">
                ${escapeHTML(productCategory)}
              </div>
              ${productCode ? `<div class="product-code">Code: ${escapeHTML(productCode)}</div>` : ""}
            </div>

            <h1 class="product-name">
              ${escapeHTML(productName)}
            </h1>


            <div class="product-price">
              ₹${Number(productPrice).toLocaleString("en-IN")}
            </div>

            <div class="stock-status ${product.is_available !== false ? "in-stock" : "out-of-stock"}" id="stockStatus">
              ${product.is_available !== false ? "In Stock" : "Out of Stock"}
            </div>

            <div class="stock-controls" id="stockControls">
              <button type="button" class="stock-option ${product.is_available !== false ? "active" : ""}" data-stock="true">In Stock</button>
              <button type="button" class="stock-option ${product.is_available === false ? "active" : ""}" data-stock="false">Out of Stock</button>
            </div>


            <div class="product-line"></div>


            <p class="product-description">
              ${escapeHTML(productDescription)}
            </p>

            ${instagramPostUrl ? `
              <section class="instagram-post-section">
                <div class="instagram-post-heading">AS SEEN ON INSTAGRAM</div>
                <div class="instagram-embed-host" id="instagramEmbedBlock">
                  <blockquote class="instagram-media" data-instgrm-permalink="${escapeHTML(instagramPostUrl)}?utm_source=ig_embed&utm_campaign=loading" data-instgrm-version="14"></blockquote>
                </div>
                <a class="instagram-post-link" href="${escapeHTML(instagramPostUrl)}" target="_blank" rel="noopener noreferrer">View original Instagram post ↗</a>
              </section>
            ` : ""}


            <div class="size-title">
              Select your size
            </div>


            <div class="sizes">
              ${sizesHTML}
            </div>

            ${sizeChartUrl ? `
              <button class="size-chart-btn" onclick="openSizeChart('${escapeHTML(sizeChartUrl)}')">
                ↗ View Size Chart
              </button>
            ` : ""}

            ${(productMaterial || productWashCare || productMoreDetails) ? `
              <div class="details-accordion">
                ${productMaterial ? `
                  <div class="details-item">
                    <button class="details-summary" type="button" onclick="toggleDetails(this)">
                      <span>Material</span><span>+</span>
                    </button>
                    <div class="details-content">${escapeHTML(productMaterial)}</div>
                  </div>` : ""}
                ${productWashCare ? `
                  <div class="details-item">
                    <button class="details-summary" type="button" onclick="toggleDetails(this)">
                      <span>Wash Care</span><span>+</span>
                    </button>
                    <div class="details-content">${escapeHTML(productWashCare)}</div>
                  </div>` : ""}
                ${productMoreDetails ? `
                  <div class="details-item">
                    <button class="details-summary" type="button" onclick="toggleDetails(this)">
                      <span>More Details</span><span>+</span>
                    </button>
                    <div class="details-content">${escapeHTML(productMoreDetails)}</div>
                  </div>` : ""}
              </div>
            ` : ""}


            <button
              class="order-btn"
              id="orderBtn"
            >
              Enquire about this piece
            </button>


            <p class="product-note">
              Every piece is thoughtfully made for her.
            </p>

          </div>


        </div>

      `;


      setupSizeSelection(productName, productPrice);
      setupStockControls(product);
      if (instagramPostUrl) processInstagramEmbed();

    }


    /* =========================
       STOCK CONTROLS
    ========================= */

    async function setupStockControls() {
      // Stock changes are managed from the protected admin dashboard.
      const controls = document.getElementById("stockControls");
      if (controls) controls.classList.remove("visible");
    }


    /* =========================
       IMAGE FUNCTIONS
    ========================= */

    function changeImage(index) {

      if (!productImages[index]) return;

      currentImageIndex = index;

      const mainImage =
        document.getElementById("mainProductImage");


      mainImage.style.opacity = "0";


      setTimeout(() => {

        mainImage.src =
          productImages[index];

        const social = productSocialLinks[index];
        mainImage.style.cursor = social ? "pointer" : "zoom-in";
        mainImage.style.opacity = "1";

      }, 150);


      document
        .querySelectorAll(".thumbnail")
        .forEach((thumbnail, i) => {

          thumbnail.classList.toggle(
            "active",
            i === index
          );

        });


      const counter =
        document.getElementById("imageCounter");


      if (counter) {

        counter.textContent =
          `${index + 1} / ${productImages.length}`;

      }

    }


    function nextImage() {

      const next =
        (currentImageIndex + 1) %
        productImages.length;

      changeImage(next);

    }


    function previousImage() {

      const previous =
        (
          currentImageIndex - 1 +
          productImages.length
        ) %
        productImages.length;

      changeImage(previous);

    }


    function openSizeChart(url) {
      const modal = document.getElementById("sizeChartModal");
      document.getElementById("sizeChartImage").src = url;
      modal.classList.add("open");
    }

    function closeSizeChartModal() {
      document.getElementById("sizeChartModal").classList.remove("open");
    }

    function toggleDetails(button) {
      button.closest(".details-item").classList.toggle("open");
    }

    document.getElementById("sizeChartModal").addEventListener("click", function(event) {
      if (event.target === this) closeSizeChartModal();
    });

    /* =========================
       IMAGE MODAL
    ========================= */

    function handleMainImageClick() {
      const social = productSocialLinks[currentImageIndex];
      if (social && social.link) {
        window.open(social.link, "_blank", "noopener,noreferrer");
        return;
      }
      openImageModal();
    }

    function openImageModal() {

      const modal =
        document.getElementById("imageModal");

      const image =
        document.getElementById("modalImage");


      image.src =
        productImages[currentImageIndex];


      modal.classList.add("open");

    }


    function closeImageModal() {

      document
        .getElementById("imageModal")
        .classList
        .remove("open");

    }


    document
      .getElementById("imageModal")
      .addEventListener("click", function(event) {

        if (event.target === this) {

          closeImageModal();

        }

      });


    /* =========================
       SIZE + WHATSAPP
    ========================= */

    function setupSizeSelection(
      productName,
      productPrice
    ) {

      const sizeButtons =
        document.querySelectorAll(".size-btn");


      sizeButtons.forEach(button => {

        button.addEventListener("click", () => {

          sizeButtons.forEach(btn =>
            btn.classList.remove("active")
          );

          button.classList.add("active");

        });

      });


      document
        .getElementById("orderBtn")
        .addEventListener("click", () => {

          const selectedSize =
            document.querySelector(
              ".size-btn.active"
            );


          const sizeText =
            selectedSize
              ? selectedSize.dataset.size
              : "Not selected";


          const message = `Hi onlyhers! 👋

I'm interested in:

${productName}

Price: ₹${productPrice}

Size: ${sizeText}

Could you please share more details?`;


          /*
            CHANGE THIS TO
            YOUR WHATSAPP NUMBER
          */

          const whatsappNumber =
            "919059828206";


          window.open(
            `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`,
            "_blank"
          );

        });

    }


    /* =========================
       ERROR
    ========================= */

    function showError(title, message) {

      document.getElementById(
        "productContent"
      ).innerHTML = `

        <div class="error-message">

          <h2>${escapeHTML(title)}</h2>

          <p>${escapeHTML(message)}</p>

          <a
            href="designs.html"
            class="collection-btn"
            style="
              color:white;
              text-decoration:none;
              display:inline-block;
            "
          >
            BACK TO COLLECTION
          </a>

        </div>

      `;

    }


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHTML(value) {

      if (
        value === null ||
        value === undefined
      ) return "";

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    loadProduct();

  </script>

</body>
</html>
