<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Create Account | OnlyHers</title><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="favicon.png"><link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 50% 50%,#a90012 0%,#79000b 36%,#3b0007 70%,#100002 100%);background-attachment:fixed;color:white;display:flex;align-items:center;justify-content:center;padding:95px 20px 30px}
.auth-box{width:100%;max-width:460px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);padding:45px 35px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.logo{display:block;text-align:center;color:white;text-decoration:none;font-family:Georgia,serif;font-size:36px;margin-bottom:35px}
h1{font-family:Georgia,serif;font-size:42px;font-weight:normal;margin-bottom:10px}.subtitle{opacity:.75;margin-bottom:30px;line-height:1.6}label{display:block;font-size:12px;letter-spacing:1px;margin:20px 0 8px;text-transform:uppercase}
input{width:100%;height:58px;padding:15px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:white;font-size:15px;outline:none;border-radius:0}input::placeholder{color:rgba(255,255,255,.55)}
button{width:100%;margin-top:28px;padding:16px;border:none;background:white;color:#a91420;font-weight:bold;cursor:pointer;font-size:14px}
.phone-wrapper{display:flex;align-items:stretch;gap:8px;width:100%}
.phone-code{width:calc(38% - 4px);height:58px;min-height:58px;flex:0 0 calc(38% - 4px);padding:0 12px;border:1px solid rgba(255,255,255,.35);border-radius:0;background:rgba(255,255,255,.08);color:white;font-size:15px;outline:none;line-height:58px}
.phone-code option{background:#a91420;color:white}
.phone-input{width:auto;flex:1;min-width:0}
.message{margin-top:18px;font-size:14px;text-align:center;min-height:20px}.error{color:#ffd0d0}.success{color:#d5ffd9}.bottom-text{text-align:center;margin-top:25px;font-size:14px;opacity:.8}.bottom-text a{color:white;font-weight:bold}
@media(max-width:520px){body{padding:88px 12px 24px}.auth-box{padding:34px 24px}.logo{font-size:32px;margin-bottom:28px}h1{font-size:36px}.phone-code{width:38%;flex-basis:38%;padding:0 8px;font-size:14px}}
</style>
<style>
/* ONLYHERS REFERENCE RED-BLACK GRADIENT */
html, body {
  min-height: 100%;
  background: radial-gradient(ellipse at 50% 50%, #a90a18 0%, #78040e 38%, #420108 68%, #170002 100%) !important;
  background-color: #170002 !important;
  background-attachment: fixed !important;
}
body { color: #fff; }
.home-page, .auth-page, .about-section, .brand-story, .home-product-feed,
.products-page, .collection-page, .product-page, .account-page, main, footer {
  background: transparent !important;
}
.navbar, header {
  background: rgba(25, 0, 4, .30) !important;
  -webkit-backdrop-filter: blur(18px) saturate(125%);
  backdrop-filter: blur(18px) saturate(125%);
}
.hero {
  background: radial-gradient(ellipse at 50% 50%, rgba(169,10,24,.90) 0%, rgba(120,4,14,.78) 38%, rgba(66,1,8,.70) 68%, rgba(23,0,2,.88) 100%) !important;
}
.main-image-container { background: rgba(255,255,255,.06) !important; }

</style>
</head>
<body>
<header class="auth-header"><a href="index.html" class="auth-logo">Onlyhers</a><a href="index.html" class="auth-home-btn">HOME</a></header>
<div class="auth-box">
<a href="index.html" class="logo">OnlyHers</a><h1>Create account.</h1>
<p class="subtitle">Create your account with your email and we'll send you a secure verification link.</p>
<div id="detailsStep">
<label>Full Name</label><input type="text" id="fullName" placeholder="Enter your full name">
<label>Phone Number</label>
<div class="phone-wrapper">
  <select id="countryCode" class="phone-code">
    <option value="+91" selected>🇮🇳 +91</option><option value="+1">🇺🇸 +1</option><option value="+44">🇬🇧 +44</option><option value="+61">🇦🇺 +61</option><option value="+971">🇦🇪 +971</option><option value="+65">🇸🇬 +65</option><option value="+60">🇲🇾 +60</option><option value="+974">🇶🇦 +974</option><option value="+966">🇸🇦 +966</option><option value="+49">🇩🇪 +49</option><option value="+33">🇫🇷 +33</option>
  </select>
  <input type="tel" id="phone" class="phone-input" placeholder="9876543210" inputmode="tel" autocomplete="tel">
</div>
<label>Email</label><input type="email" id="email" placeholder="Enter your email" autocomplete="email">
<button id="sendOtpBtn">SEND SIGN-UP LINK</button>
</div>
<div id="otpStep" hidden>
<label>Verification Code</label><input type="text" id="otp" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit OTP" autocomplete="one-time-code">
<button id="verifyOtpBtn">VERIFY & CREATE ACCOUNT</button>
<button id="resendOtpBtn" style="background:transparent;color:white;border:1px solid rgba(255,255,255,.5);margin-top:12px">RESEND LINK</button>
</div>
<div id="message" class="message"></div>
<div class="bottom-text">Already have an account? <a href="login.html">Login</a></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://zeodtbgxadxfvexvywpm.supabase.co";
const SUPABASE_KEY="sb_publishable_ywvo11SASIHo-oeNZasF0Q__LmK-oxr";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);let signupEmail="",signupName="";
function message(text,type=""){ $("message").textContent=text;$("message").className="message "+type; }
async function sendOtp(){
 const fullName=$("fullName").value.trim();const countryCode=$("countryCode").value;const phoneNumber=$("phone").value.trim();const email=$("email").value.trim().toLowerCase();
 if(!fullName||!phoneNumber||!email){message("Please enter your name, phone number and email.","error");return;}
 const phone=countryCode+" "+phoneNumber;signupName=fullName;signupEmail=email;message("Sending your sign-up link...");
 const {error}=await supabaseClient.auth.signInWithOtp({email,options:{shouldCreateUser:true,emailRedirectTo:window.location.origin+'/account.html',data:{full_name:fullName,phone:phone}}});
 if(error){message(error.message,"error");return;}message("Sign-up link sent! Check your email and tap the link to create your account.","success");
}
async function verifyOtp(){const token=$("otp").value.trim();if(!/^[0-9]{6}$/.test(token)){message("Please enter the 6-digit OTP.","error");return;}message("Verifying...");const {error}=await supabaseClient.auth.verifyOtp({email:signupEmail,token,type:"email"});if(error){message(error.message,"error");return;}message("Welcome to OnlyHers!","success");window.location.href="account.html";}
$("sendOtpBtn").onclick=sendOtp;$("resendOtpBtn").onclick=sendOtp;const otpStep=$("otpStep");if(otpStep)otpStep.remove();
</script></body></html>
