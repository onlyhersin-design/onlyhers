<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | OnlyHers</title>

<link rel="stylesheet" href="style.css">

<style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #a91420;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .auth-box {
      width: 100%;
      max-width: 460px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 45px 35px;
    }

    .logo {
      display: block;
      text-align: center;
      color: white;
      text-decoration: none;
      font-family: Georgia, serif;
      font-size: 36px;
      margin-bottom: 35px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 42px;
      font-weight: normal;
      margin-bottom: 10px;
    }

    .subtitle {
      opacity: .75;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    label {
      display: block;
      font-size: 12px;
      letter-spacing: 1px;
      margin: 20px 0 8px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid rgba(255,255,255,.35);
      background: rgba(255,255,255,.08);
      color: white;
      font-size: 15px;
      outline: none;
    }

    input::placeholder {
      color: rgba(255,255,255,.55);
    }
.phone-wrapper {
  display: flex;
  gap: 8px;
}

.phone-code {
  width: 140px;
  padding: 15px 10px;
  border: 1px solid rgba(255,255,255,.35);
  background: rgba(255,255,255,.08);
  color: white;
  font-size: 15px;
  outline: none;
  cursor: pointer;
}

.phone-code option {
  background: #a91420;
  color: white;
}

.phone-input {
  flex: 1;
}
    button {
      width: 100%;
      margin-top: 28px;
      padding: 16px;
      border: none;
      background: white;
      color: #a91420;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #1b1b1b;
      color: white;
    }

    .message {
      margin-top: 18px;
      font-size: 14px;
      text-align: center;
      min-height: 20px;
    }

    .error { color: #ffd0d0; }
    .success { color: #d5ffd9; }

    .bottom-text {
      text-align: center;
      margin-top: 25px;
      font-size: 14px;
      opacity: .8;
    }

    .bottom-text a {
      color: white;
      font-weight: bold;
    }
  </style>
</head>

<body>
<!-- AUTH HEADER START -->
<header class="auth-header">
    <a href="index.html" class="auth-logo">Onlyhers</a>
    <a href="index.html" class="auth-home-btn">HOME</a>
</header>
<!-- AUTH HEADER END -->
</header>
  <div class="auth-box">

    <a href="index.html" class="logo">OnlyHers</a>

    <h1>Create account.</h1>

    <p class="subtitle">
      Join OnlyHers and make this little fashion space yours.
    </p>

    <label>Full Name</label>
    <input
      type="text"
      id="fullName"
      placeholder="Enter your full name"
      required
    >

<label>Phone Number</label>

<div class="phone-wrapper">

  <select id="countryCode" class="phone-code">

    <!-- India default -->
    <option value="+91" selected>
      🇮🇳 +91
    </option>

    <option value="+1">
      🇺🇸 +1
    </option>

    <option value="+44">
      🇬🇧 +44
    </option>

    <option value="+61">
      🇦🇺 +61
    </option>

    <option value="+971">
      🇦🇪 +971
    </option>

    <option value="+65">
      🇸🇬 +65
    </option>

    <option value="+60">
      🇲🇾 +60
    </option>

    <option value="+974">
      🇶🇦 +974
    </option>

    <option value="+966">
      🇸🇦 +966
    </option>

    <option value="+49">
      🇩🇪 +49
    </option>

    <option value="+33">
      🇫🇷 +33
    </option>

    <option value="+39">
      🇮🇹 +39
    </option>

    <option value="+81">
      🇯🇵 +81
    </option>

    <option value="+82">
      🇰🇷 +82
    </option>

    <option value="+86">
      🇨🇳 +86
    </option>

    <option value="+91">
      India +91
    </option>

  </select>


  <input
    type="tel"
    id="phone"
    class="phone-input"
    placeholder="9876543210"
    required
  >

</div>
    

    <label>Email</label>
    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Create a password"
      required
    >

    <button id="signupBtn">
      CREATE ACCOUNT
    </button>

    <div id="message" class="message"></div>

    <div class="bottom-text">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://zeodtbgxadxfvexvywpm.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_ywvo11SASIHo-oeNZasF0Q__LmK-oxr";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    document
      .getElementById("signupBtn")
      .addEventListener("click", async () => {

        const fullName =
          document
            .getElementById("fullName")
            .value
            .trim();

       const countryCode =
  document
    .getElementById("countryCode")
    .value;

const phoneNumber =
  document
    .getElementById("phone")
    .value
    .trim();

const phone =
  `${countryCode} ${phoneNumber}`;

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;

        const message =
          document.getElementById("message");


        if (!fullName || !phone || !email || !password) {

          message.textContent =
            "Please fill in all details.";

          message.className =
            "message error";

          return;
        }


        message.textContent =
          "Creating your account...";

        message.className =
          "message";


        const {
          data,
          error
        } = await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            data: {
              full_name: fullName,
              phone: phone
            }

          }

        });


        if (error) {

          message.textContent =
            error.message;

          message.className =
            "message error";

          return;
        }


        message.textContent =
          "Account created successfully! Redirecting...";

        message.className =
          "message success";


        setTimeout(() => {

          /*
          If email confirmation is enabled,
          the user may need to verify email first.
          */

          window.location.href =
            "account.html";

        }, 1000);

      });

  </script>

</body>
</html>
