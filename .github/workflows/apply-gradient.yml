name: Apply OnlyHers gradient theme

# The OnlyHers theme is now maintained directly in the repository.
# This workflow is kept manual so it cannot overwrite homepage layout changes
# or race with normal website commits.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gradient:
    runs-on: ubuntu-latest
    steps:
      - name: Theme is maintained in the repository
        run: echo "OnlyHers theme is maintained directly in style.css and page files."
