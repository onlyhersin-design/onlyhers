<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;padding-top:75px;font-family:"DM Sans",sans-serif;color:#fff;background:radial-gradient(ellipse at 50% 25%,#a90a18 0%,#78040e 38%,#420108 68%,#170002 100%);background-attachment:fixed}.navbar{height:75px;position:fixed;top:0;left:0;width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 8%;z-index:20;background:rgba(25,0,4,.36);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.17)}.brand{font:600 30px "Playfair Display",serif;color:#fff;text-decoration:none}.nav-links{display:flex;gap:24px}.nav-links a{color:#fff;text-decoration:none;font-size:12px}.intro{padding:48px 8% 32px}.back{display:inline-block;color:#fff;text-decoration:none;font-size:10px;letter-spacing:1.7px;opacity:.75;margin-bottom:24px}.eyebrow{font-size:10px;letter-spacing:4px;opacity:.7;margin-bottom:14px}.intro h1{font:500 clamp(40px,6vw,70px)/1.05 "Playfair Display",serif}.intro p{font-size:13px;line-height:1.7;opacity:.72;margin-top:14px}.products{padding:10px 8% 90px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:25px 20px}.item{min-width:0;color:#fff;text-decoration:none}.photo{aspect-ratio:3/4;overflow:hidden;background:rgba(255,255,255,.07)}.photo img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .45s}.item:hover .photo img{transform:scale(1.04)}.info{padding:12px 2px}.category{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;opacity:.65;margin-bottom:6px}.name{font:500 18px/1.2 "Playfair Display",serif;margin-bottom:8px}.price{font-size:12px;font-weight:600}.empty{grid-column:1/-1;text-align:center;padding:55px 20px;border:1px solid rgba(255,255,255,.16);font-size:13px;line-height:1.8;opacity:.75}footer{text-align:center;padding:30px 20px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;opacity:.7}
@media(max-width:900px){.products{grid-template-columns:repeat(3,minmax(0,1fr));padding-left:6%;padding-right:6%;gap:20px 15px}}@media(max-width:650px){body{padding-top:68px}.navbar{height:68px;padding:0 5%}.brand{font-size:25px}.nav-links{gap:13px}.nav-links a{font-size:10px}.intro{padding:36px 6% 25px}.products{grid-template-columns:repeat(2,minmax(0,1fr));padding:5px 6% 65px;gap:18px 12px}.name{font-size:16px}.info{padding-top:10px}}@media(max-width:370px){.products{gap:15px 9px}}
</style></head><body>
<header class="navbar"><a href="index.html" class="brand">OnlyHers</a><nav class="nav-links"><a href="index.html">Home</a><a href="collection.html">Collections</a></nav></header>
<main><section class="intro"><a class="back" href="collection.html">← BACK TO COLLECTIONS</a><div class="eyebrow" id="eyebrow">ONLYHERS COLLECTION</div><h1 id="pageTitle">Shop Collection</h1><p id="pageDescription">Explore the collection.</p></section><section class="products" id="itemsGrid"><div class="empty">Loading collection…</div></section></main><footer>OnlyHers · Thoughtfully made for her.</footer>
<script>
const SUPABASE_URL="https://zeodtbgxadxfvexvywpm.supabase.co",SUPABASE_KEY="sb_publishable_ywvo11SASIHo-oeNZasF0Q__LmK-oxr";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const config={onlyhers_designs:{title:"OnlyHers Designs",eyebrow:"DESIGNED BY ONLYHERS",description:"Original pieces thoughtfully designed by OnlyHers.",kind:"product"},customisations:{title:"Customisations",eyebrow:"MADE MORE YOU",description:"Selected designs that can be personalised to suit your preferences.",kind:"product"},recreations:{title:"Recreations",eyebrow:"INSPIRED BY YOUR IDEAS",description:"Explore recreated styles and inspiration-led pieces from OnlyHers.",kind:"product"},fabrics:{title:"Fabrics",eyebrow:"CHOOSE YOUR MATERIAL",description:"Discover fabrics for your own creations, available by the metre.",kind:"fabric"},all:{title:"Shop All Collection",eyebrow:"THE FULL COLLECTION",description:"Browse all OnlyHers designs in one place.",kind:"all"}};
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}function price(v){return v==null?"Price on request":"₹"+Number(v).toLocaleString("en-IN")}
function render(items,kind){const grid=document.getElementById("itemsGrid");if(!items.length){grid.innerHTML='<div class="empty">There are no items in this section yet. Please check back soon.</div>';return}grid.innerHTML=items.map(item=>{const name=item.name||"OnlyHers",image=item.image_url||item.image||"",fabric=kind==="fabric",category=fabric?(item.material||item.pattern||"Fabric"):(item.category||"OnlyHers"),cost=fabric?(item.price==null?"Price on request":price(item.price)+" / metre"):price(item.price),href=fabric?"fabric.html?id="+encodeURIComponent(item.id):"product.html?id="+encodeURIComponent(item.id);return '<a class="item" href="'+href+'"><div class="photo">'+(image?'<img src="'+esc(image)+'" alt="'+esc(name)+'" loading="lazy">':'')+'</div><div class="info"><div class="category">'+esc(category)+'</div><div class="name">'+esc(name)+'</div><div class="price">'+esc(cost)+'</div></div></a>'}).join("")}
async function init(){const key=new URLSearchParams(location.search).get("section")||"all",selected=config[key]||config.all;document.title=selected.title+" | OnlyHers";document.getElementById("pageTitle").textContent=selected.title;document.getElementById("eyebrow").textContent=selected.eyebrow;document.getElementById("pageDescription").textContent=selected.description;const grid=document.getElementById("itemsGrid");try{if(selected.kind==="fabric"){const {data,error}=await db.from("fabrics").select("*").order("created_at",{ascending:false});if(error)throw error;render(data||[],"fabric")}else{const {data,error}=await db.from("products").select("*").order("created_at",{ascending:false});if(error)throw error;let products=data||[];if(selected.kind!=="all")products=products.filter(p=>(p.collection_section||"onlyhers_designs")===key);render(products,"product")}}catch(error){console.error(error);grid.innerHTML='<div class="empty">This collection could not be loaded right now. Please refresh and try again.</div>'}}init();
</script></body></html>
