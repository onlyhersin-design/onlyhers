<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Login | OnlyHers</title>

<link rel="stylesheet" href="style.css">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 50% 50%,#a90012 0%,#79000b 36%,#3b0007 70%,#100002 100%);background-attachment:fixed;color:white;display:flex;align-items:center;justify-content:center;padding:95px 20px 30px}
    .auth-box{width:100%;max-width:460px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);padding:45px 35px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
    .logo{display:block;text-align:center;color:white;text-decoration:none;font-family:Georgia,serif;font-size:36px;margin-bottom:35px}h1{font-family:Georgia,serif;font-size:42px;font-weight:normal;margin-bottom:10px}.subtitle{opacity:.75;margin-bottom:24px;line-height:1.6}.login-options{display:flex;gap:8px;margin:0 0 18px}.login-options button{margin:0;padding:11px;background:transparent;color:white;border:1px solid rgba(255,255,255,.35);font-size:12px}.login-options button.active{background:white;color:#a91420;border-color:white}.password-wrap{display:none}.password-wrap.show{display:block}.forgot{display:block;text-align:right;margin-top:10px;color:white;font-size:12px;opacity:.8;text-decoration:none}
    label{display:block;font-size:12px;letter-spacing:1px;margin:20px 0 8px;text-transform:uppercase}input{width:100%;padding:15px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:white;font-size:15px;outline:none}input::placeholder{color:rgba(255,255,255,.55)}
    button{width:100%;margin-top:28px;padding:16px;border:none;background:white;color:#a91420;font-weight:bold;cursor:pointer;font-size:14px}.message{margin-top:18px;text-align:center;font-size:14px;min-height:20px}.error{color:#ffd0d0}.success{color:#d5ffd9}.bottom-text{text-align:center;margin-top:25px;font-size:14px;opacity:.8}.bottom-text a{color:white;font-weight:bold}
    @media(max-width:520px){body{padding:88px 12px 24px}.auth-box{padding:34px 24px}.logo{font-size:32px;margin-bottom:28px}h1{font-size:36px}}
  </style>

<meta name="theme-color" content="#78040e">

<!-- OnlyHers site icon -->
<link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">
<link rel="apple-touch-icon" sizes="512x512" href="/favicon.png">
<meta name="theme-color" content="#78040e">

<style>
/* ONLYHERS REFERENCE RED-BLACK GRADIENT */
html, body {
  min-height: 100%;
  background: radial-gradient(ellipse at 50% 50%, #a90a18 0%, #78040e 38%, #420108 68%, #170002 100%) !important;
  background-color: #170002 !important;
  background-attachment: fixed !important;
}
body { color: #fff; }
.home-page, .auth-page, .about-section, .brand-story, .home-product-feed,
.products-page, .collection-page, .product-page, .account-page, main, footer {
  background: transparent !important;
}
.navbar, header {
  background: rgba(25, 0, 4, .30) !important;
  -webkit-backdrop-filter: blur(18px) saturate(125%);
  backdrop-filter: blur(18px) saturate(125%);
}
.hero {
  background: radial-gradient(ellipse at 50% 50%, rgba(169,10,24,.90) 0%, rgba(120,4,14,.78) 38%, rgba(66,1,8,.70) 68%, rgba(23,0,2,.88) 100%) !important;
}
.main-image-container { background: rgba(255,255,255,.06) !important; }

</style>
</head>
<body>
<header class="auth-header"><a href="index.html" class="auth-logo">Onlyhers</a><a href="index.html" class="auth-home-btn">HOME</a></header>
<div class="auth-box">
  <a href="index.html" class="logo">OnlyHers</a>
  <h1>Welcome back.</h1>
  <p class="subtitle" id="loginSubtitle">Choose how you'd like to sign in.</p>
  <div class="login-options">
    <button type="button" id="magicMode" class="active">EMAIL LINK</button>
    <button type="button" id="passwordMode">PASSWORD</button>
  </div>
  <div id="emailStep">
    <label>Email</label>
    <input type="email" id="email" placeholder="Enter your email" autocomplete="email">
    <div id="passwordWrap" class="password-wrap">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
      <a href="#" id="forgotPassword" class="forgot">Forgot password?</a>
    </div>
    <button id="loginBtn">SEND SIGN-IN LINK</button>
  </div>
  <div id="message" class="message"></div>
  <div class="bottom-text">New to OnlyHers? <a href="signup.html">Create an account</a></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://zeodtbgxadxfvexvywpm.supabase.co";
const SUPABASE_KEY="sb_publishable_ywvo11SASIHo-oeNZasF0Q__LmK-oxr";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);let loginMode="magic";
function message(text,type=""){$("message").textContent=text;$("message").className="message "+type;}
function setMode(mode){loginMode=mode;const passwordMode=mode==="password";$("magicMode").classList.toggle("active",!passwordMode);$("passwordMode").classList.toggle("active",passwordMode);$("passwordWrap").classList.toggle("show",passwordMode);$("loginSubtitle").textContent=passwordMode?"Enter your email and password to sign in.":"Enter your email and we'll send you a secure sign-in link.";$("loginBtn").textContent=passwordMode?"LOGIN WITH PASSWORD":"SEND SIGN-IN LINK";message("");}
async function login(){const email=$("email").value.trim().toLowerCase();if(!email){message("Please enter your email.","error");return;}if(loginMode==="password"){const password=$("password").value;if(!password){message("Please enter your password.","error");return;}message("Signing you in...");const {error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){message(error.message,"error");return;}message("Welcome back! Redirecting...","success");window.location.href="account.html";return;}message("Sending your sign-in link...");const {error}=await supabaseClient.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:window.location.origin+"/account.html"}});if(error){message(error.message,"error");return;}message("Sign-in link sent! Check your email and tap the link to continue.","success");}
async function forgotPassword(e){e.preventDefault();const email=$("email").value.trim().toLowerCase();if(!email){message("Enter your email first, then click Forgot password.","error");$("email").focus();return;}message("Sending password reset link...");const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+"/account.html"});if(error){message(error.message,"error");return;}message("Password reset link sent! Check your email.","success");}
$("magicMode").onclick=()=>setMode("magic");$("passwordMode").onclick=()=>setMode("password");$("loginBtn").onclick=login;$("forgotPassword").onclick=forgotPassword;$("email").addEventListener("keydown",e=>{if(e.key==="Enter")login();});$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login();});
</script>
</body></html>
