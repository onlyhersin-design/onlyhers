<header class="navbar"><a href="index.html" class="brand">Onlyhers</a><nav class="nav-links"><a href="fabrics.html">Fabrics</a></nav></header>
<main class="fabric-page"><a href="fabrics.html" class="back">← FABRICS</a><div id="fabricContent"><div class="error">Loading fabric...</div></div></main>
<script>
const SUPABASE_URL="https://zeodtbgxadxfvexvywpm.supabase.co";
const SUPABASE_KEY="sb_publishable_ywvo11SASIHo-oeNZasF0Q__LmK-oxr";
let currentFabricImages=[]; let currentFabricImage=0; let currentFabricSocialLinks={};
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);


function handleFabricImageError(img){if(!img)return;img.style.display="none";const thumb=img.closest(".fabric-thumb");if(thumb)thumb.style.display="none";}
function setFabricImage(index){if(!currentFabricImages[index])return;currentFabricImage=index;const img=document.getElementById("fabricMainImage");if(img){img.src=currentFabricImages[index];img.style.cursor=currentFabricSocialLinks[index]?"pointer":"default";}document.querySelectorAll(".fabric-thumb").forEach(function(el,i){el.classList.toggle("active",i===index)});const counter=document.getElementById("fabricGalleryCounter");if(counter)counter.textContent=(index+1)+" / "+currentFabricImages.length;}
function changeFabricImage(direction){if(!currentFabricImages.length)return;setFabricImage((currentFabricImage+direction+currentFabricImages.length)%currentFabricImages.length);}
function handleFabricImageClick(){const social=currentFabricSocialLinks[currentFabricImage];if(social&&social.link)window.open(social.link,"_blank","noopener,noreferrer");}
async function loadFabric(){
 const id=new URLSearchParams(location.search).get("id"); if(!id){showError("Fabric not found");return;}
 const {data:f,error}=await supabaseClient.from("fabrics").select("*").eq("id",id).single();
 if(error||!f){console.error(error);showError("This fabric is currently unavailable.");return;}
 const name=f.name||"OnlyHers Fabric", desc=f.description||"A fabric selected by OnlyHers for comfortable, beautiful creations.";
 document.title=name+" | OnlyHers Fabrics";
 document.getElementById("metaDescription").content=desc;
 document.getElementById("canonicalUrl").href=location.origin+"/fabric.html?id="+encodeURIComponent(f.id);
 const img=f.image_url||"";
 const price=f.price!=null?"₹"+Number(f.price).toLocaleString("en-IN")+" / metre":"Price on request";
 const available=Math.max(0,Math.floor(Number(f.available_meters)||0));
 const meterOptions=Array.from({length:available},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+' metre'+(i===0?'':'s')+'</option>').join("");
 const msg=encodeURIComponent("Hi OnlyHers! 👋\n\nI'm interested in this fabric:\n"+name+"\nQuantity: "+(document.getElementById("meterQuantity")?.value||1)+" metre(s)\n"+price+"\n\nCould you please share more details?");
 currentFabricImages=[img];
 if(Array.isArray(f.image_urls)) f.image_urls.forEach(function(url){if(typeof url==="string" && url.trim() && !currentFabricImages.includes(url.trim())) currentFabricImages.push(url.trim());});
 currentFabricSocialLinks={};
 if(f.instagram_photo_url && f.instagram_link){currentFabricSocialLinks[currentFabricImages.length]={platform:"Instagram",link:f.instagram_link};currentFabricImages.push(f.instagram_photo_url);}
 if(f.youtube_photo_url && f.youtube_link){currentFabricSocialLinks[currentFabricImages.length]={platform:"YouTube",link:f.youtube_link};currentFabricImages.push(f.youtube_photo_url);}
 var galleryHtml='<div class="fabric-gallery"><div class="fabric-main-image"><img id="fabricMainImage" src="'+escapeHTML(currentFabricImages[0]||"")+'" alt="'+escapeHTML(name)+'" onclick="handleFabricImageClick()">'+(currentFabricImages.length>1?'<button class="fabric-gallery-arrow prev" onclick="changeFabricImage(-1)">‹</button><button class="fabric-gallery-arrow next" onclick="changeFabricImage(1)">›</button>':'')+'<div class="fabric-gallery-counter" id="fabricGalleryCounter">1 / '+(currentFabricImages.length||1)+'</div></div><div class="fabric-thumbnails">'+currentFabricImages.map(function(url,i){return '<button type="button" class="fabric-thumb '+(i===0?"active":"")+'" onclick="setFabricImage('+i+')"><img src="'+escapeHTML(url)+'" alt="'+escapeHTML(name)+' view '+(i+1)+'">'+(currentFabricSocialLinks[i]?'<span class="fabric-social-label">'+escapeHTML(currentFabricSocialLinks[i].platform)+'</span>':'')+'</button>';}).join("")+'</div></div>';
 document.getElementById("fabricContent").innerHTML=galleryHtml+'<div class="fabric-layout" style="display:block"><div class="fabric-details"><div class="code">'+escapeHTML(f.fabric_code||"ONLYHERS FABRIC")+'</div><h1 class="name">'+escapeHTML(name)+'</h1><div class="price">'+price+'</div><div class="wholesale-note">For wholesale enquiries above 10 metres, reach out to us.</div><div class="stock '+(f.is_available!==false?"in":"out")+'">'+(f.is_available!==false?"In Stock":"Out of Stock")+'</div>'+(f.is_available!==false && available>0?'<div class="meter-selection"><label for="meterQuantity">Select quantity</label><select id="meterQuantity">'+meterOptions+'</select><div class="available-meters">'+available+' metre'+(available===1?"":"s")+' available</div></div>':'<div class="available-meters" style="margin-top:14px">'+available+' metre'+(available===1?"":"s")+' available</div>')+'<p class="description">'+escapeHTML(desc)+'</p><div class="facts">'+(f.material?'<div class="fact"><span>Material</span><span>'+escapeHTML(f.material)+'</span></div>':"")+(f.width?'<div class="fact"><span>Width</span><span>'+escapeHTML(f.width)+'</span></div>':"")+'</div><a class="order" id="fabricOrder" target="_blank" href="https://wa.me/919059828206?text='+msg+'">ENQUIRE ABOUT THIS FABRIC</a></div></div>';
}
function showError(t){document.getElementById("fabricContent").innerHTML='<div class="error"><h2>'+escapeHTML(t)+'</h2><p style="margin-top:12px;opacity:.7">Please return to the fabric collection.</p></div>'}
function escapeHTML(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
loadFabric();
document.addEventListener("change",function(e){if(e.target.id==="meterQuantity"){const q=e.target.value;const el=document.getElementById("fabricOrder");if(el){el.href="https://wa.me/919059828206?text="+encodeURIComponent("Hi OnlyHers! 👋\n\nI'm interested in this fabric:\n"+document.querySelector(".name").textContent+"\nQuantity: "+q+" metre(s)\n"+document.querySelector(".price").textContent+"\n\nCould you please share more details?");}}});
</script></body></html>
