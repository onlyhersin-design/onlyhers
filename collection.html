<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Collection — Onlyhers</title>
  <link rel="icon" type="image/png" href="favicon.png">
<link rel="shortcut icon" type="image/png" href="favicon.png">


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="app.js" defer></script>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f8f5f0;
      color: #181818;
    }


    nav {

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 20px 7%;

      border-bottom: 1px solid #ddd;

    }


    .logo {

      font-family: Georgia, serif;

      font-size: 30px;

      font-weight: bold;

      color: #181818;

      text-decoration: none;

    }


    .nav-right,
    #authArea {

      display: flex;
      align-items: center;
      gap: 15px;

    }


    .login-link,
    .account-link {

      text-decoration: none;

      color: #181818;

      font-size: 12px;

    }


    .signup-link {

      background: #181818;

      color: white;

      padding: 10px 15px;

      text-decoration: none;

      font-size: 12px;

    }


    .logout-button {

      border: none;

      background: none;

      cursor: pointer;

      color: #a31d28;

      font-size: 11px;

    }


    .header {

      padding: 70px 8% 40px;

    }


    .header p {

      font-size: 11px;

      letter-spacing: 3px;

      margin-bottom: 15px;

    }


    .header h1 {

      font-family: Georgia, serif;

      font-size: clamp(50px, 7vw, 90px);

      font-weight: normal;

    }


    #productsGrid {

      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(250px, 1fr));

      gap: 25px;

      padding: 20px 8% 100px;

    }


    .product-card {

      color: #181818;

      text-decoration: none;

      display: block;

    }


    .image-box {

      aspect-ratio: 3 / 4;

      background: #e4ded6;

      overflow: hidden;

      margin-bottom: 18px;

    }


    .image-box img {

      width: 100%;
      height: 100%;

      object-fit: cover;

      transition: 0.5s;

    }


    .product-card:hover img {

      transform: scale(1.05);

    }


    .category {

      font-size: 11px;

      color: #777;

      letter-spacing: 1px;

      text-transform: uppercase;

      margin-bottom: 8px;

    }


    .name {

      font-family: Georgia, serif;

      font-size: 23px;

      font-weight: normal;

      margin-bottom: 10px;

    }


    .price {

      font-size: 15px;

      font-weight: bold;

    }


    .message {

      grid-column: 1 / -1;

      text-align: center;

      padding: 60px;

    }


    @media(max-width: 600px) {

      #productsGrid {

        grid-template-columns: repeat(2, 1fr);

        gap: 15px;

        padding: 15px 5% 70px;

      }


      .name {
        font-size: 18px;
      }


      .account-link {
        display: none;
      }

    }

  </style>

</head>


<body>


  <nav>

    <a href="index.html" class="logo">
      OnlyHers
    </a>


    <div class="nav-right">

      <a href="index.html" class="login-link">
        HOME
      </a>

      <div id="authArea"></div>

    </div>

  </nav>



  <section class="header">

    <p>ONLYHERS COLLECTION</p>

    <h1>
      Collection
    </h1>

  </section>



  <div id="productsGrid">

    <div class="message">
      Loading collection...
    </div>

  </div>



  <script>

    async function loadProducts() {

      const grid =
        document.getElementById("productsGrid");


      const { data, error } =
        await supabaseClient
          .from("products")
          .select("*")
          .order("created_at", {
            ascending: false
          });


      if (error) {

        console.error(error);

        grid.innerHTML = `
          <div class="message">
            Unable to load products.<br><br>
            ${escapeHTML(error.message)}
          </div>
        `;

        return;

      }


      if (!data || data.length === 0) {

        grid.innerHTML = `
          <div class="message">
            No products available yet.
          </div>
        `;

        return;

      }


      grid.innerHTML = "";


      data.forEach(product => {

        const name =
          product.name ||
          product.title ||
          "Untitled Product";


        const image =
          product.image_url ||
          product.image ||
          "";


        const category =
          product.category || "";


        grid.innerHTML += `

          <a
            href="product.html?id=${encodeURIComponent(product.id)}"
            class="product-card"
          >

            <div class="image-box">

              ${
                image
                  ? `<img src="${escapeHTML(image)}" alt="${escapeHTML(name)}">`
                  : `<div></div>`
              }

            </div>


            <div class="category">
              ${escapeHTML(category)}
            </div>


            <h2 class="name">
              ${escapeHTML(name)}
            </h2>


            <div class="price">
              ${formatPrice(product.price)}
            </div>


          </a>

        `;

      });

    }


    loadProducts();

  </script>


</body>

</html>
