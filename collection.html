<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Collection — onlyhers</title>

  <!-- Favicon -->

<!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap"
    rel="stylesheet"
  >


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Your Supabase App -->
  <script src="app.js"></script>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    :root {
      --red-main: #98131d;
      --red-header: #bd2632;
      --red-dark: #670a12;
      --red-light: #cf3b46;

      --white: #fffaf8;
      --soft-white: rgba(255,255,255,0.82);

      --black: #161313;
    }


    html {
      scroll-behavior: smooth;
    }


    body {

      padding-top: 76px;

      font-family: "DM Sans", sans-serif;

      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(220,70,80,0.35),
          transparent 25%
        ),

        radial-gradient(
          circle at 90% 80%,
          rgba(80,0,10,0.4),
          transparent 30%
        ),

        var(--red-main);

      color: var(--white);

      min-height: 100vh;

      overflow-x: hidden;

    }



    /* ============================
       NAVIGATION
    ============================ */

    .navbar {

      height: 76px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0 8%;

      background: rgba(35, 10, 13, 0.32);

      -webkit-backdrop-filter: blur(18px) saturate(125%);
      backdrop-filter: blur(18px) saturate(125%);

      box-shadow: 0 8px 28px rgba(0,0,0,.10);

      position: fixed;

      top: 0;
      left: 0;
      width: 100%;
      box-sizing: border-box;

      z-index: 1000;

      border-bottom:
        1px solid rgba(255,255,255,0.12);

    }


    .brand {

      font-family:
        "Playfair Display",
        serif;

      font-size: 30px;

      font-weight: 600;

      color: white;

      text-decoration: none;

      letter-spacing: -1px;

    }


    .nav-links {

      display: flex;

      align-items: center;

      gap: 28px;

    }


    .nav-links a {

      color: white;

      text-decoration: none;

      font-size: 13px;

      letter-spacing: 0.5px;

      transition: 0.25s ease;

    }


    .nav-links a:hover {

      opacity: 0.7;

    }


    .nav-links .active {

      border-bottom:
        1px solid white;

      padding-bottom: 5px;

    }


    .account-link {

      border:
        1px solid rgba(255,255,255,0.8);

      padding:
        9px 16px;

    }



    /* ============================
       HERO
    ============================ */

    .collection-hero {

      position: relative;

      padding:
        100px 8%
        70px;

      overflow: hidden;

    }


    .collection-hero::before {

      content: "ONLYHERS";

      position: absolute;

      font-family:
        "Playfair Display",
        serif;

      font-size:
        clamp(90px, 16vw, 250px);

      font-weight: 600;

      color:
        rgba(255,255,255,0.035);

      white-space: nowrap;

      top: 15px;

      left: 50%;

      transform:
        translateX(-50%);

      pointer-events: none;

      letter-spacing: -10px;

    }


    .hero-content {

      position: relative;

      z-index: 2;

      max-width: 850px;

    }


    .eyebrow {

      font-size: 11px;

      letter-spacing: 4px;

      opacity: 0.75;

      margin-bottom: 22px;

    }


    .collection-hero h1 {

      font-family:
        "Playfair Display",
        serif;

      font-size:
        clamp(60px, 9vw, 130px);

      font-weight: 500;

      line-height: 0.9;

      letter-spacing: -4px;

      margin-bottom: 25px;

    }


    .collection-hero h1 span {

      font-style: italic;

    }


    .collection-description {

      max-width: 520px;

      line-height: 1.8;

      color: var(--soft-white);

      font-size: 16px;

    }



    /* ============================
       SEARCH
    ============================ */

    .search-section {

      padding:
        0 8%
        50px;

    }


    .search-wrapper {

      max-width: 550px;

      position: relative;

    }


    #searchInput {

      width: 100%;

      background:
        rgba(255,255,255,0.1);

      border:
        1px solid rgba(255,255,255,0.25);

      color: white;

      padding:
        16px 50px 16px 20px;

      font-family:
        "DM Sans",
        sans-serif;

      font-size: 14px;

      outline: none;

      transition: 0.3s;

    }


    #searchInput::placeholder {

      color:
        rgba(255,255,255,0.55);

    }


    #searchInput:focus {

      background:
        rgba(255,255,255,0.15);

      border-color:
        rgba(255,255,255,0.7);

    }


    .search-icon {

      position: absolute;

      right: 18px;

      top: 50%;

      transform:
        translateY(-50%);

      opacity: 0.65;

      pointer-events: none;

    }



    /* ============================
       COLLECTION AREA
    ============================ */

    .collection-area {

      padding:
        30px 8%
        120px;

    }


    .collection-top {

      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 40px;

    }


    .collection-top h2 {

      font-family:
        "Playfair Display",
        serif;

      font-size: 34px;

      font-weight: 500;

    }


    #productCount {

      font-size: 13px;

      opacity: 0.7;

    }



    /* ============================
       PRODUCT GRID
    ============================ */

    .products-grid {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(240px, 1fr)
        );

      gap: 28px;

    }


    /* PRODUCT CARD */

    .product-card {

      cursor: pointer;

      animation:
        productAppear
        0.6s ease both;

    }


    .product-image-wrapper {

      position: relative;

      width: 100%;

      aspect-ratio: 3 / 4;

      overflow: hidden;

      background:
        rgba(255,255,255,0.08);

    }


    .product-image {

      width: 100%;

      height: 100%;

      object-fit: cover;

      display: block;

      transition:
        transform 0.7s
        cubic-bezier(.2,.8,.2,1);

    }


    .product-card:hover
    .product-image {

      transform:
        scale(1.07);

    }


    /* Overlay */

    .product-overlay {

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          to top,
          rgba(0,0,0,0.35),
          transparent 45%
        );

      opacity: 0;

      transition: 0.4s;

    }


    .product-card:hover
    .product-overlay {

      opacity: 1;

    }


    .view-product {

      position: absolute;

      bottom: 20px;

      left: 20px;

      font-size: 11px;

      letter-spacing: 2px;

      opacity: 0;

      transform:
        translateY(10px);

      transition: 0.35s;

    }


    .product-card:hover
    .view-product {

      opacity: 1;

      transform:
        translateY(0);

    }



    /* PRODUCT INFORMATION */

    .product-info {

      padding:
        18px 3px
        10px;

    }


    .product-category {

      font-size: 10px;

      letter-spacing: 2px;

      text-transform: uppercase;

      opacity: 0.6;

      margin-bottom: 8px;

    }


    .product-name {

      font-family:
        "Playfair Display",
        serif;

      font-size: 21px;

      font-weight: 500;

      margin-bottom: 9px;

      line-height: 1.2;

    }


    .product-bottom {

      display: flex;

      justify-content: space-between;

      align-items: center;

    }


    .product-price {

      font-size: 14px;

      font-weight: 600;

    }


    .arrow {

      font-size: 20px;

      transition: 0.3s;

    }


    .product-card:hover
    .arrow {

      transform:
        translateX(5px);

    }



    /* ============================
       LOADING
    ============================ */

    .loading {

      grid-column:
        1 / -1;

      text-align: center;

      padding: 80px 20px;

      opacity: 0.75;

    }


    .loader {

      width: 35px;

      height: 35px;

      border-radius: 50%;

      border:
        2px solid
        rgba(255,255,255,0.2);

      border-top-color: white;

      margin:
        0 auto 20px;

      animation:
        spin 0.8s linear infinite;

    }


    @keyframes spin {

      to {

        transform:
          rotate(360deg);

      }

    }



    /* ============================
       EMPTY STATE
    ============================ */

    .empty-state {

      grid-column:
        1 / -1;

      text-align: center;

      padding: 100px 20px;

    }


    .empty-state h3 {

      font-family:
        "Playfair Display",
        serif;

      font-size: 40px;

      font-weight: 500;

      margin-bottom: 15px;

    }


    .empty-state p {

      opacity: 0.7;

      margin-bottom: 25px;

    }


    .empty-state a {

      color: white;

      text-decoration: none;

      border-bottom:
        1px solid white;

      padding-bottom: 5px;

    }



    /* ============================
       ERROR
    ============================ */

    .error-message {

      grid-column:
        1 / -1;

      text-align: center;

      padding: 70px 20px;

      border:
        1px solid
        rgba(255,255,255,0.2);

      background:
        rgba(0,0,0,0.08);

    }



    /* ============================
       ANIMATIONS
    ============================ */

    @keyframes productAppear {

      from {

        opacity: 0;

        transform:
          translateY(25px);

      }

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }



    /* ============================
       FOOTER
    ============================ */

    footer {

      background:
        var(--red-dark);

      padding:
        70px 8%;

      text-align: center;

      border-top:
        1px solid
        rgba(255,255,255,0.08);

    }


    footer h2 {

      font-family:
        "Playfair Display",
        serif;

      font-size: 42px;

      font-weight: 500;

      margin-bottom: 12px;

    }


    footer p {

      font-size: 14px;

      opacity: 0.7;

    }



    /* ============================
       MOBILE
    ============================ */

    @media
    (max-width: 700px) {

      .navbar {

        height: 68px;
        padding:
          0 5%;

      }

      body {
        padding-top: 68px;
      }


      .brand {

        font-size: 25px;

      }


      .nav-links {

        gap: 14px;

      }


      .nav-links a {

        font-size: 11px;

      }


      .collection-hero {

        padding:
          80px 6%
          55px;

      }


      .collection-hero h1 {

        letter-spacing: -2px;

      }


      .search-section {

        padding:
          0 6%
          35px;

      }


      .collection-area {

        padding:
          20px 6%
          80px;

      }


      .products-grid {

        grid-template-columns:
          repeat(2, 1fr);

        gap: 15px;

      }


      .product-name {

        font-size: 17px;

      }


      .collection-top h2 {

        font-size: 27px;

      }


      .account-link {

        padding:
          7px 10px;

      }

    }


    @media
    (max-width: 400px) {

      .products-grid {

        grid-template-columns:
          1fr;

      }

    }

  </style>

<meta name="theme-color" content="#78040e">

<!-- OnlyHers site icon -->
<link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">
<link rel="apple-touch-icon" sizes="512x512" href="/favicon.png">
<meta name="theme-color" content="#78040e">

<style>
/* ONLYHERS REFERENCE RED-BLACK GRADIENT */
html, body {
  min-height: 100%;
  background: radial-gradient(ellipse at 50% 50%, #a90a18 0%, #78040e 38%, #420108 68%, #170002 100%) !important;
  background-color: #170002 !important;
  background-attachment: fixed !important;
}
body { color: #fff; }
.home-page, .auth-page, .about-section, .brand-story, .home-product-feed,
.products-page, .collection-page, .product-page, .account-page, main, footer {
  background: transparent !important;
}
.navbar, header {
  background: rgba(25, 0, 4, .30) !important;
  -webkit-backdrop-filter: blur(18px) saturate(125%);
  backdrop-filter: blur(18px) saturate(125%);
}
.hero {
  background: radial-gradient(ellipse at 50% 50%, rgba(169,10,24,.90) 0%, rgba(120,4,14,.78) 38%, rgba(66,1,8,.70) 68%, rgba(23,0,2,.88) 100%) !important;
}
.main-image-container { background: rgba(255,255,255,.06) !important; }

</style>
</head>


<body>


  <!-- ============================
       NAVIGATION
  ============================= -->

  <header class="navbar">

    <a
      href="index.html"
      class="brand"
    >
      Onlyhers
    </a>


    <nav class="nav-links">

      <a href="index.html">
        Home
      </a>

      <a
        href="login.html"
        id="loginLink"
        class="account-link"
      >
        Login
      </a>

    </nav>

  </header>



  <!-- ============================
       HERO
  ============================= -->

  <section class="collection-hero">

    <div class="hero-content">

      <p class="eyebrow">
        ONLYHERS — 2026
      </p>


      <h1>
        The Collection
        <span>.</span>
      </h1>


      <p class="collection-description">

        Pieces made to become part of your story.
        Explore our latest collection, thoughtfully
        designed for every version of her.

      </p>

    </div>

  </section>



  <!-- ============================
       SEARCH
  ============================= -->

  <section class="search-section">

    <div class="search-wrapper">

      <input
        type="text"
        id="searchInput"
        placeholder="Search your next favourite piece..."
      >

      <span class="search-icon">
        ⌕
      </span>

    </div>

  </section>



  <!-- ============================
       PRODUCTS
  ============================= -->

  <main class="collection-area">


    <div class="collection-top">

      <h2>
        All Pieces
      </h2>


      <span id="productCount">
        Loading...
      </span>

    </div>



    <div
      id="productsGrid"
      class="products-grid"
    >

      <div class="loading">

        <div class="loader"></div>

        Loading the collection...

      </div>

    </div>


  </main>



  <!-- ============================
       FOOTER
  ============================= -->

  <footer>

    <h2>
      OnlyHers
    </h2>


    <p>
      A little fashion, a little lifestyle,
      a little her.
    </p>

  </footer>



  <!-- ============================
       JAVASCRIPT
  ============================= -->

  <script>

    let allProducts = [];


    /* ----------------------------
       CHECK LOGIN STATUS
    ----------------------------- */

    async function checkUser() {

      try {

        const {
          data: {
            session
          }
        } =
        await supabaseClient
          .auth
          .getSession();


        const loginLink =
          document.getElementById(
            "loginLink"
          );


        if (session) {

          loginLink.textContent =
            "My Account";

          loginLink.href =
            "account.html";

        }

      }

      catch (error) {

        console.log(
          "Auth check:",
          error
        );

      }

    }



    /* ----------------------------
       LOAD PRODUCTS
    ----------------------------- */

    async function loadProducts() {

      const grid =
        document.getElementById(
          "productsGrid"
        );


      const count =
        document.getElementById(
          "productCount"
        );


      try {

        if (
          typeof supabaseClient ===
          "undefined"
        ) {

          throw new Error(
            "Supabase is not connected. Check app.js."
          );

        }


        const {
          data: products,
          error
        } =
        await supabaseClient
          .from("products")
          .select("*")
          .order(
            "created_at",
            {
              ascending: false
            }
          );


        if (error) {

          throw error;

        }


        allProducts =
          products || [];


        renderProducts(
          allProducts
        );


      }

      catch (error) {

        console.error(
          "Product loading error:",
          error
        );


        grid.innerHTML = `

          <div class="error-message">

            <h3>
              Couldn't load the collection
            </h3>

            <p style="
              margin-top:12px;
              opacity:.7;
            ">
              ${escapeHTML(
                error.message ||
                "Please check your Supabase connection."
              )}
            </p>

          </div>

        `;


        count.textContent =
          "Unable to load";

      }

    }



    /* ----------------------------
       RENDER PRODUCTS
    ----------------------------- */

    function renderProducts(products) {

      const grid =
        document.getElementById(
          "productsGrid"
        );


      const count =
        document.getElementById(
          "productCount"
        );


      count.textContent =
        `${products.length} ${
          products.length === 1
            ? "piece"
            : "pieces"
        }`;


      if (!products.length) {

        grid.innerHTML = `

          <div class="empty-state">

            <h3>
              Something beautiful is coming.
            </h3>

            <p>
              Our collection is being curated.
              Check back soon.
            </p>

            <a href="index.html">
              Back to home →
            </a>

          </div>

        `;

        return;

      }


      grid.innerHTML =
        products
          .map(
            (
              product,
              index
            ) => {

              const image =
                product.image_url ||
                product.image ||
                "";


              const name =
                product.name ||
                "Untitled Piece";


              const category =
                product.category ||
                "OnlyHers Collection";


              const price =
                product.price !== null &&
                product.price !== undefined
                  ? `₹${Number(
                      product.price
                    ).toLocaleString(
                      "en-IN"
                    )}`
                  : "Price on request";


              return `

                <article
                  class="product-card"
                  style="
                    animation-delay:
                    ${index * 0.08}s
                  "
                  onclick="
                    openProduct(
                      '${product.id}'
                    )
                  "
                >

                  <div
                    class="
                      product-image-wrapper
                    "
                  >

                    ${
                      image
                        ? `

                          <img
                            src="${escapeHTML(
                              image
                            )}"
                            alt="${escapeHTML(
                              name
                            )}"
                            class="product-image"
                            loading="lazy"
                          >

                        `
                        : `

                          <div style="
                            height:100%;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            opacity:.5;
                            font-family:
                            'Playfair Display',
                            serif;
                          ">
                            OnlyHers
                          </div>

                        `
                    }


                    <div
                      class="
                        product-overlay
                      "
                    ></div>


                    <span
                      class="
                        view-product
                      "
                    >
                      VIEW PIECE →
                    </span>

                  </div>


                  <div
                    class="
                      product-info
                    "
                  >

                    <div
                      class="
                        product-category
                      "
                    >
                      ${escapeHTML(
                        category
                      )}
                    </div>


                    <h3
                      class="
                        product-name
                      "
                    >
                      ${escapeHTML(
                        name
                      )}
                    </h3>


                    <div
                      class="
                        product-bottom
                      "
                    >

                      <span
                        class="
                          product-price
                        "
                      >
                        ${price}
                      </span>


                      <span
                        class="arrow"
                      >
                        →
                      </span>

                    </div>

                  </div>

                </article>

              `;

            }
          )
          .join("");

    }



    /* ----------------------------
       OPEN PRODUCT
    ----------------------------- */

    function openProduct(id) {

      window.location.href =
        `product.html?id=${id}`;

    }



    /* ----------------------------
       SEARCH
    ----------------------------- */

    document
      .getElementById(
        "searchInput"
      )
      .addEventListener(
        "input",
        function(event) {

          const search =
            event.target
              .value
              .toLowerCase()
              .trim();


          const filtered =
            allProducts.filter(
              product => {

                const name =
                  (
                    product.name ||
                    ""
                  )
                  .toLowerCase();


                const category =
                  (
                    product.category ||
                    ""
                  )
                  .toLowerCase();


                return (
                  name.includes(search) ||
                  category.includes(search)
                );

              }
            );


          renderProducts(
            filtered
          );

        }
      );



    /* ----------------------------
       SECURITY HELPER
    ----------------------------- */

    function escapeHTML(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }


      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }



    /* ----------------------------
       START
    ----------------------------- */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        checkUser();

        loadProducts();

      }
    );

  </script>


</body>
</html>
